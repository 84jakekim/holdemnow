<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1100" font-family="Pretendard, sans-serif">
  <!-- 라이트 베이스 -->
  <rect width="390" height="1100" fill="#FFFFFF"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#FFFFFF"/>
  <text x="28" y="28" fill="#111111" font-size="15" font-weight="600">9:41</text>
  <text x="350" y="27" fill="#111111" font-size="13">100%</text>

  <!-- Top bar -->
  <g transform="translate(20, 56)">
    <!-- 로고 (단순) -->
    <circle cx="6" cy="14" r="5" fill="#E53E3E"/>
    <text x="20" y="20" fill="#111111" font-size="20" font-weight="800" letter-spacing="-0.5">Pink Rabbit</text>
    
    <!-- 알림 아이콘 -->
    <g transform="translate(330, 8)">
      <path d="M3 7 Q3 3 8 3 Q13 3 13 7 L13 12 L14 13 L2 13 L3 12 Z" fill="none" stroke="#111111" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="14" cy="4" r="3" fill="#E53E3E"/>
    </g>
  </g>

  <!-- 검색바 -->
  <g transform="translate(20, 100)">
    <rect width="350" height="44" rx="22" fill="#F7F7F7"/>
    <circle cx="22" cy="22" r="6" fill="none" stroke="#767676" stroke-width="1.5"/>
    <line x1="27" y1="27" x2="32" y2="32" stroke="#767676" stroke-width="1.5" stroke-linecap="round"/>
    <text x="46" y="27" fill="#767676" font-size="14">매장·지역·토너 검색</text>
  </g>

  <!-- 지역 탭 -->
  <g transform="translate(20, 162)">
    <!-- 부산 (활성) -->
    <rect width="60" height="32" rx="16" fill="#111111"/>
    <text x="30" y="21" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">부산 ▼</text>
    
    <rect x="68" width="48" height="32" rx="16" fill="#FFFFFF" stroke="#EAEAEA"/>
    <text x="92" y="21" fill="#111111" font-size="12" text-anchor="middle">서면</text>
    
    <rect x="124" width="52" height="32" rx="16" fill="#FFFFFF" stroke="#EAEAEA"/>
    <text x="150" y="21" fill="#111111" font-size="12" text-anchor="middle">해운대</text>
    
    <rect x="184" width="52" height="32" rx="16" fill="#FFFFFF" stroke="#EAEAEA"/>
    <text x="210" y="21" fill="#111111" font-size="12" text-anchor="middle">광안리</text>
    
    <rect x="244" width="48" height="32" rx="16" fill="#FFFFFF" stroke="#EAEAEA"/>
    <text x="268" y="21" fill="#111111" font-size="12" text-anchor="middle">동래</text>

    <rect x="300" width="48" height="32" rx="16" fill="#FFFFFF" stroke="#EAEAEA"/>
    <text x="324" y="21" fill="#111111" font-size="12" text-anchor="middle">양산</text>
  </g>

  <!-- 섹션: 지금 LIVE -->
  <g transform="translate(20, 220)">
    <circle cx="6" cy="8" r="4" fill="#E53E3E"/>
    <circle cx="6" cy="8" r="7" fill="none" stroke="#E53E3E" stroke-width="1" opacity="0.4"/>
    <text x="20" y="13" fill="#111111" font-size="18" font-weight="800">지금 LIVE</text>
    <text x="350" y="13" fill="#767676" font-size="13" text-anchor="end">전체 →</text>
  </g>

  <!-- LIVE 카드 1 (큰 매장 사진/포스터가 주인공) -->
  <g transform="translate(20, 245)">
    <!-- 카드 1 - 토너 포스터 메인 -->
    <g>
      <rect width="220" height="290" rx="14" fill="#F7F7F7"/>
      
      <!-- 매장이 업로드한 콘텐츠 영역 (5:4) -->
      <rect width="220" height="200" rx="14" fill="#E5DDD5"/>
      <!-- 포스터 placeholder 텍스트 (실제론 매장 콘텐츠 이미지) -->
      <text x="110" y="80" fill="#A8A8A8" font-size="11" text-anchor="middle">매장 업로드</text>
      <text x="110" y="95" fill="#767676" font-size="14" font-weight="600" text-anchor="middle">토너 포스터</text>
      <text x="110" y="115" fill="#A8A8A8" font-size="10" text-anchor="middle">또는 매장 사진</text>
      
      <!-- 가상 토너 포스터 디자인 표시 -->
      <rect x="40" y="125" width="140" height="55" rx="6" fill="#1A1A1A"/>
      <text x="110" y="148" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">FREEZE 90GTD</text>
      <text x="110" y="166" fill="#FFB800" font-size="10" font-weight="600" text-anchor="middle">19:00 · BUY-IN 50,000</text>
      
      <!-- LIVE 뱃지 (상단 좌측, 작게) -->
      <rect x="12" y="12" width="58" height="24" rx="12" fill="#E53E3E"/>
      <circle cx="22" cy="24" r="3" fill="#FFFFFF"/>
      <text x="36" y="28" fill="#FFFFFF" font-size="11" font-weight="800" letter-spacing="0.5">LIVE</text>
      
      <!-- 거리 (상단 우측) -->
      <rect x="160" y="12" width="48" height="24" rx="12" fill="#FFFFFF" opacity="0.95"/>
      <text x="184" y="28" fill="#111111" font-size="11" font-weight="600" text-anchor="middle">2.3km</text>
      
      <!-- 정보 영역 (사진 아래) -->
      <text x="14" y="225" fill="#111111" font-size="15" font-weight="700">서면 ABC홀덤</text>
      <text x="14" y="245" fill="#767676" font-size="12">프리징 90GTD · Lv 3</text>
      <line x1="14" y1="255" x2="206" y2="255" stroke="#EAEAEA" stroke-width="1"/>
      <text x="14" y="273" fill="#E53E3E" font-size="11" font-weight="700">⏱ 추가등록 12분</text>
    </g>
    
    <!-- 카드 2 (옆에 살짝 보이기) -->
    <g transform="translate(232, 0)">
      <rect width="220" height="290" rx="14" fill="#F7F7F7"/>
      <rect width="220" height="200" rx="14" fill="#D4DCE4"/>
      <text x="110" y="100" fill="#A8A8A8" font-size="11" text-anchor="middle">매장 사진</text>
      
      <rect x="12" y="12" width="58" height="24" rx="12" fill="#E53E3E"/>
      <circle cx="22" cy="24" r="3" fill="#FFFFFF"/>
      <text x="36" y="28" fill="#FFFFFF" font-size="11" font-weight="800">LIVE</text>
      
      <text x="14" y="225" fill="#111111" font-size="15" font-weight="700">해운대 포커펍</text>
      <text x="14" y="245" fill="#767676" font-size="12">캐쉬 1/2 NLH · 자리 2석</text>
    </g>
  </g>

  <!-- 섹션: 오늘의 토너 -->
  <g transform="translate(20, 565)">
    <text x="0" y="13" fill="#111111" font-size="18" font-weight="800">오늘의 토너</text>
    <text x="350" y="13" fill="#767676" font-size="13" text-anchor="end">전체 →</text>
  </g>

  <!-- 토너 포스터 가로 스크롤 (3:4 비율) -->
  <g transform="translate(20, 590)">
    <!-- 포스터 1 - 매장이 디자인한 포스터 그대로 노출 -->
    <g>
      <rect width="160" height="213" rx="12" fill="#1A1A1A"/>
      <!-- 포스터 가상 디자인 -->
      <text x="80" y="50" fill="#FFB800" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="2">SPECIAL</text>
      <text x="80" y="95" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">MEGA</text>
      <text x="80" y="120" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">TOURNEY</text>
      <line x1="40" y1="135" x2="120" y2="135" stroke="#FFB800" stroke-width="1.5"/>
      <text x="80" y="158" fill="#FFFFFF" font-size="11" text-anchor="middle">게런티</text>
      <text x="80" y="178" fill="#FFB800" font-size="20" font-weight="800" text-anchor="middle">3,000,000</text>
      <text x="80" y="198" fill="#A8A8A8" font-size="9" text-anchor="middle">광안리 카드클럽</text>
    </g>
    <text x="0" y="234" fill="#111111" font-size="13" font-weight="700">메가 토너 300GTD</text>
    <text x="0" y="250" fill="#767676" font-size="11">광안리 카드클럽 · 14:00</text>
    
    <!-- 포스터 2 -->
    <g transform="translate(172, 0)">
      <rect width="160" height="213" rx="12" fill="#F0E6D2"/>
      <text x="80" y="45" fill="#7C5E2F" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="2">DAILY</text>
      <rect x="20" y="60" width="120" height="100" rx="6" fill="#FFFFFF"/>
      <text x="80" y="100" fill="#1A1A1A" font-size="18" font-weight="800" text-anchor="middle">딥스택</text>
      <text x="80" y="125" fill="#1A1A1A" font-size="14" text-anchor="middle">50 GTD</text>
      <text x="80" y="145" fill="#767676" font-size="10" text-anchor="middle">바이인 50,000</text>
      <text x="80" y="185" fill="#7C5E2F" font-size="11" font-weight="600" text-anchor="middle">19:00 시작</text>
    </g>
    <text x="172" y="234" fill="#111111" font-size="13" font-weight="700">딥스택 50GTD</text>
    <text x="172" y="250" fill="#767676" font-size="11">서면 ABC홀덤 · 19:00</text>
    
    <!-- 포스터 3 (살짝 보이기) -->
    <g transform="translate(344, 0)">
      <rect width="160" height="213" rx="12" fill="#0E3D2C"/>
      <text x="80" y="80" fill="#FFFFFF" font-size="11" text-anchor="middle">SATELLITE</text>
    </g>
  </g>

  <!-- 섹션: 주변 매장 -->
  <g transform="translate(20, 890)">
    <text x="0" y="13" fill="#111111" font-size="18" font-weight="800">주변 매장</text>
    <text x="350" y="13" fill="#767676" font-size="13" text-anchor="end">정렬: 거리순 ▼</text>
  </g>

  <!-- 매장 카드 (야놀자 스타일 큰 사진 + 정보) -->
  <g transform="translate(20, 915)">
    <rect width="350" height="160" rx="14" fill="#FFFFFF" stroke="#EAEAEA"/>
    
    <!-- 좌측 큰 사진 -->
    <rect width="160" height="160" rx="14" fill="#E5DDD5"/>
    <text x="80" y="80" fill="#A8A8A8" font-size="11" text-anchor="middle">매장 사진</text>
    <text x="80" y="95" fill="#767676" font-size="12" font-weight="600" text-anchor="middle">5:4 비율</text>
    
    <!-- 매장 로고 미니어처 -->
    <circle cx="30" cy="135" r="14" fill="#FFFFFF"/>
    <text x="30" y="140" fill="#111111" font-size="11" font-weight="800" text-anchor="middle">A</text>
    
    <!-- 우측 정보 -->
    <g transform="translate(176, 16)">
      <text x="0" y="14" fill="#111111" font-size="16" font-weight="700">서면 ABC홀덤</text>
      
      <g transform="translate(0, 28)">
        <text x="0" y="12" fill="#FFB800" font-size="11">★</text>
        <text x="10" y="12" fill="#111111" font-size="11" font-weight="600">4.7</text>
        <text x="26" y="12" fill="#A8A8A8" font-size="11">(142)</text>
        <text x="56" y="12" fill="#767676" font-size="11">· 2.3km</text>
      </g>
      
      <!-- 태그들 -->
      <g transform="translate(0, 56)">
        <rect width="58" height="20" rx="10" fill="#FEE2E2"/>
        <circle cx="10" cy="10" r="2.5" fill="#E53E3E"/>
        <text x="36" y="14" fill="#E53E3E" font-size="10" font-weight="700" text-anchor="middle">LIVE 중</text>

        <rect x="65" width="48" height="20" rx="10" fill="#F0FDF4"/>
        <text x="89" y="14" fill="#00875A" font-size="10" font-weight="600" text-anchor="middle">VIP</text>
      </g>
      
      <line x1="0" y1="88" x2="158" y2="88" stroke="#EAEAEA"/>
      
      <text x="0" y="104" fill="#767676" font-size="11">프리징 90GTD · Lv 3</text>
      <text x="0" y="122" fill="#E53E3E" font-size="11" font-weight="700">⏱ 추가등록 12분</text>
    </g>
  </g>

  <!-- 매장 카드 2 -->
  <g transform="translate(20, 1085)">
    <rect width="350" height="0" rx="14" fill="#FFFFFF" stroke="#EAEAEA"/>
  </g>

  <!-- 안내선 표시 -->
  <text x="195" y="1085" fill="#A8A8A8" font-size="9" text-anchor="middle" font-style="italic">↓ 매장 카드 계속 (스크롤)</text>
</svg>

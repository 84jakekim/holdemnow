<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="50%" stop-color="#d81b6a"/>
      <stop offset="100%" stop-color="#5a0b2c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="rgba(255,150,200,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,150,200,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="rgba(255,80,160,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,80,160,0)"/>
    </radialGradient>
    <radialGradient id="glow3" cx="60%" cy="40%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#pinkGrad)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>
  <!-- soft white scan lines for premium feel -->
  <g opacity="0.04" fill="#fff">
    <rect x="0" y="0" width="1920" height="2"/>
    <rect x="0" y="270" width="1920" height="2"/>
    <rect x="0" y="540" width="1920" height="2"/>
    <rect x="0" y="810" width="1920" height="2"/>
    <rect x="0" y="1078" width="1920" height="2"/>
  </g>
</svg>

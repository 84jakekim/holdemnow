<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0f08"/>
      <stop offset="55%" stop-color="#0c0604"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a14a"/>
      <stop offset="50%" stop-color="#f5d97e"/>
      <stop offset="100%" stop-color="#a87320"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(212,161,74,0.18)"/>
      <stop offset="55%" stop-color="rgba(212,161,74,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="diamondGrid" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="120" height="120" fill="none"/>
      <rect x="58" y="58" width="4" height="4" fill="rgba(212,161,74,0.08)"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" fill="url(#diamondGrid)"/>
  <rect width="1920" height="1080" fill="url(#spot)"/>
  <!-- subtle red accent ribbon -->
  <rect x="0" y="980" width="1920" height="6" fill="#b3252a"/>
  <rect x="0" y="990" width="1920" height="2" fill="rgba(212,161,74,0.6)"/>
  <!-- top corners — playing card pips -->
  <g fill="url(#gold)" opacity="0.18">
    <text x="80" y="120" font-family="serif" font-size="84" font-weight="700">♠</text>
    <text x="1800" y="120" font-family="serif" font-size="84" font-weight="700" text-anchor="end">♣</text>
    <text x="80" y="1020" font-family="serif" font-size="84" font-weight="700">♦</text>
    <text x="1800" y="1020" font-family="serif" font-size="84" font-weight="700" text-anchor="end">♥</text>
  </g>
</svg>

  <rect width="512" height="512" rx="96" fill="#0A0E0C"/>

  <!-- LIVE 펄스 도트 (Signal Red) -->
  <circle cx="160" cy="256" r="48" fill="#D94B3D"/>

  <!-- "H" 모노그램 (Champagne Gold) -->

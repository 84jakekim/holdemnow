<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 48" width="310" height="48" role="img" aria-label="HoldemNow">
  <!--
    HoldemNow 워드마크 v7 — 흰색 버전 (핑크 그라데이션 헤더용)
    ─ logo.svg와 동일한 커스텀 path 레터링
    ─ Holdem=#FFFFFF / Now=rgba(255,255,255,0.90)
    ─ 카드 심볼: 반투명 흰 (핑크 배경이 살짝 비침)
    ─ LIVE 도트: 빨강 계열 유지 (의미 보존)
    ─ 카드 A: #FFB3D9 (핑크 배경에서 가독성)
  -->
  <defs>
    <!-- LIVE 도트 (핑크 배경 위에서도 빨강 의미 보존) -->
    <radialGradient id="liveDotW7" cx="38%" cy="33%" r="65%">
      <stop offset="0%" stop-color="#FFB3B3"/>
      <stop offset="45%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E53E3E"/>
    </radialGradient>
    <!-- 글로우 (흰빛) -->
    <radialGradient id="liveGlowW7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 카드 반투명 흰 -->
    <linearGradient id="cardShineW7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.96)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.85)"/>
    </linearGradient>
  </defs>

  <!-- ══ 카드 심볼 ══ -->
  <g transform="translate(11,24) rotate(8) translate(-11,-24)">
    <rect x="1.5" y="5" width="19" height="28" rx="3.8"
      fill="url(#cardShineW7)" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
    <!-- A -->
    <path d="M5.5,16.5 L8,9.5 L10.5,16.5 M6.3,14 L9.7,14"
      fill="none" stroke="#D1006B" stroke-width="1.4"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 우하단 펄스 도트 -->
    <circle cx="16.5" cy="29.5" r="1.5" fill="#E53E3E">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 글로우 -->
    <circle cx="11" cy="20" r="7.5" fill="url(#liveGlowW7)">
      <animate attributeName="r" values="7.5;9.5;7.5" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- LIVE 도트 -->
    <circle cx="11" cy="20" r="4.8" fill="url(#liveDotW7)">
      <animate attributeName="r" values="4.8;5.4;4.8" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <circle cx="9.4" cy="18.4" r="1.3" fill="#FFFFFF" opacity="0.80"/>
  </g>

  <!-- ══ "Holdem" — #FFFFFF ══ -->

  <!-- H -->
  <line x1="35" y1="11" x2="35" y2="38"
    stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>
  <line x1="54" y1="11" x2="54" y2="38"
    stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>
  <line x1="35" y1="25" x2="54" y2="25"
    stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

  <!-- o -->
  <circle cx="72" cy="28.5" r="9.5"
    fill="none" stroke="#FFFFFF" stroke-width="10.5"/>

  <!-- l -->
  <line x1="90" y1="11" x2="90" y2="38"
    stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- d -->
  <circle cx="108" cy="28.5" r="9"
    fill="none" stroke="#FFFFFF" stroke-width="10.5"/>
  <line x1="117.5" y1="11" x2="117.5" y2="38"
    stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>

  <!-- e -->
  <path d="M 128.25,36.73 A 9.5,9.5 0 1 0 141.23,23.75"
    fill="none" stroke="#FFFFFF" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="123" y1="28.5" x2="143" y2="28.5"
    stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>

  <!-- m -->
  <line x1="154" y1="19" x2="154" y2="38"
    stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>
  <path d="M154,22 Q165.5,13 170,22"
    fill="none" stroke="#FFFFFF" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="170" y1="22" x2="170" y2="38"
    stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>
  <path d="M170,22 Q181.5,13 186,22"
    fill="none" stroke="#FFFFFF" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="186" y1="22" x2="186" y2="38"
    stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>

  <!-- ══ "Now" — rgba(255,255,255,0.90) ══
       미세 opacity 차이로 Holdem / Now 색 리듬 유지 -->

  <!-- N -->
  <line x1="204" y1="11" x2="204" y2="38"
    stroke="rgba(255,255,255,0.90)" stroke-width="11" stroke-linecap="round"/>
  <line x1="229" y1="11" x2="229" y2="38"
    stroke="rgba(255,255,255,0.90)" stroke-width="11" stroke-linecap="round"/>
  <line x1="204" y1="11" x2="229" y2="38"
    stroke="rgba(255,255,255,0.90)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- o -->
  <circle cx="248" cy="28.5" r="9.5"
    fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="11"/>

  <!-- w -->
  <polyline points="265,19 271.5,38 278,26.5 284.5,38 291,19"
    fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ LIVE 도트 (x=291, y=19) ══ -->
  <circle cx="291" cy="19" r="11" fill="url(#liveGlowW7)">
    <animate attributeName="r" values="11;14.5;11" dur="2.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="291" cy="19" r="5.2" fill="url(#liveDotW7)">
    <animate attributeName="r" values="5.2;5.9;5.2" dur="2.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="289.2" cy="17.2" r="1.6" fill="#FFFFFF" opacity="0.80"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 44" width="248" height="44" role="img" aria-label="HoldemNow">
  <!--
    HoldemNow 워드마크 v6 — 흰색 버전 (핑크 그라데이션 헤더용)
    ─ 카드 심볼: 흰 카드 → 반투명 흰(opacity 0.15 테두리 + 흰 내부) + 빨강 LIVE 도트
    ─ "Holdem" = #FFFFFF, "Now" = #FFFFFF (옅은 opacity 차이 없음 — 헤더에서 이미 색 구분됨)
    ─ 카드 A 표기: 흰색 (핑크 배경 대비)
    ─ LIVE 도트: 빨강 계열 유지 (의미 보존)
  -->
  <defs>
    <!-- LIVE 도트 빨강 (흰 배경과 달리 조금 더 밝게) -->
    <radialGradient id="liveDotW6" cx="38%" cy="33%" r="65%">
      <stop offset="0%" stop-color="#FFB3B3"/>
      <stop offset="45%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E53E3E"/>
    </radialGradient>
    <!-- 도트 글로우 (흰 배경용보다 투명도 높게) -->
    <radialGradient id="liveGlowW6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 카드 흰색 (핑크 배경 위이므로 반투명 흰) -->
    <linearGradient id="cardShineW6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.85)"/>
    </linearGradient>
  </defs>

  <!-- ── 카드 심볼 ── -->
  <g transform="translate(10,22) rotate(8) translate(-10,-22)">
    <rect x="1" y="5" width="18" height="27" rx="3.5"
      fill="url(#cardShineW6)" stroke="rgba(255,255,255,0.60)" stroke-width="1.1"/>
    <text x="3" y="12"
      font-family="'Pretendard', Georgia, serif"
      font-size="5.5" font-weight="900" letter-spacing="-0.03em"
      fill="#C8006B">A</text>
    <circle cx="15.5" cy="28" r="1.4" fill="#E53E3E">
      <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 글로우 -->
    <circle cx="10" cy="19" r="7" fill="url(#liveGlowW6)">
      <animate attributeName="r" values="7;9;7" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 메인 LIVE 도트 -->
    <circle cx="10" cy="19" r="4.5" fill="url(#liveDotW6)">
      <animate attributeName="r" values="4.5;5.1;4.5" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <circle cx="8.6" cy="17.6" r="1.2" fill="#FFFFFF" opacity="0.80"/>
  </g>

  <!-- ── 워드마크 흰색 ── -->
  <text x="28" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.055em"
    fill="#FFFFFF">Holdem</text>

  <text x="153" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.055em"
    fill="rgba(255,255,255,0.88)">Now</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" role="img" aria-label="hold'emNow">
  <!--
    hold'emNow 워드마크 v5
    ─ 심볼: 살짝 기울인(8°) 에이스 카드 + 빨강 그라데이션 LIVE 도트
    ─ 에이스 카드 = "홀덤 최고의 패" 메타포, LIVE 도트 = "지금 진행 중" 신호
    ─ 카드 모서리 A 표기 + 중앙 빨강 그라데이션 도트 (♠ 대신)
    ─ hold = #111827, ' = #FF1F8F, em = #111827, Now = #FF1F8F
  -->
  <defs>
    <!-- LIVE 도트 빨강 그라데이션 (안쪽 밝은 빨강 → 바깥 진한 빨강) -->
    <radialGradient id="liveDotGradW" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="45%" stop-color="#E53E3E"/>
      <stop offset="100%" stop-color="#C53030"/>
    </radialGradient>
    <!-- 도트 글로우 (미세 레이어) -->
    <radialGradient id="liveGlowW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E53E3E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E53E3E" stop-opacity="0"/>
    </radialGradient>
    <!-- 카드 내부 흰색 광택 -->
    <linearGradient id="cardShineW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F9FAFB" stop-opacity="1"/>
    </linearGradient>
    <!-- SMIL 펄스 (정적 SVG 뷰어용 fallback도 고려) -->
  </defs>

  <!-- ── 카드 심볼 영역 (전체 44px 높이 안에서, 8° 회전) ── -->
  <!-- 카드 그룹: 중심 (10, 22) 기준 8° 회전 -->
  <g transform="translate(10,22) rotate(8) translate(-10,-22)">

    <!-- 카드 본체 (흰 배경 + 얇은 테두리) -->
    <rect x="1" y="5" width="18" height="27" rx="3.5"
      fill="url(#cardShineW)" stroke="#D1D5DB" stroke-width="1.2"/>

    <!-- 카드 모서리 A 표기 — 좌상단 -->
    <text x="3" y="12"
      font-family="'Pretendard', 'Georgia', serif"
      font-size="5.5" font-weight="900" letter-spacing="-0.03em"
      fill="#111827">A</text>

    <!-- 카드 모서리 펄스 도트 — 우하단 (A 아래 작은 빨강 도트) -->
    <circle cx="15.5" cy="28" r="1.4" fill="#E53E3E">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </circle>

    <!-- 중앙 LIVE 도트 — 메인 (♠ 대신 빨강 그라데이션 원) -->
    <!-- 글로우 배경 원 -->
    <circle cx="10" cy="19" r="7" fill="url(#liveGlowW)">
      <animate attributeName="r" values="7;9;7" dur="2.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </circle>
    <!-- 메인 도트 -->
    <circle cx="10" cy="19" r="4.5" fill="url(#liveDotGradW)">
      <animate attributeName="r" values="4.5;5.2;4.5" dur="2.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </circle>
    <!-- 도트 내부 하이라이트 (광택 포인트) -->
    <circle cx="8.5" cy="17.5" r="1.2" fill="#FFFFFF" opacity="0.70"/>
  </g>

  <!-- ── 워드마크 ── -->
  <!-- "hold" -->
  <text x="28" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.045em"
    fill="#111827">hold</text>

  <!-- "'" 핑크 아포스트로피 -->
  <text x="92" y="28"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="20" font-weight="800"
    fill="#FF1F8F">'</text>

  <!-- "em" -->
  <text x="100" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.045em"
    fill="#111827">em</text>

  <!-- "Now" 핑크 -->
  <text x="147" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.045em"
    fill="#FF1F8F">Now</text>
</svg>

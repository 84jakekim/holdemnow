<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 48" width="310" height="48" role="img" aria-label="HoldemNow">
  <!--
    HoldemNow 워드마크 v7
    ─ 커스텀 SVG path 레터링 — font-family 의존 없음
    ─ 지오메트릭 산세리프 / stroke-linecap="round" stroke-linejoin="round"
    ─ 획 두께 10.5 (균일) / 크로스바 8
    ─ 캡높이 y=11 / x높이 y=19 / 베이스라인 y=38
    ─ Holdem=#111827  Now=#FF1F8F
    ─ w 끝점에 빨강 LIVE 도트 (로고마크 에이스 카드와 패밀리)
    ─ 아포스트로피 생략 — 클린 워드마크
  -->
  <defs>
    <radialGradient id="liveDot7" cx="38%" cy="33%" r="65%">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="45%" stop-color="#E53E3E"/>
      <stop offset="100%" stop-color="#9B1C1C"/>
    </radialGradient>
    <radialGradient id="liveGlow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E53E3E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E53E3E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardShine7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
  </defs>

  <!-- ══ 카드 심볼 (8° 기울임) ══ -->
  <g transform="translate(11,24) rotate(8) translate(-11,-24)">
    <rect x="1.5" y="5" width="19" height="28" rx="3.8"
      fill="url(#cardShine7)" stroke="#D1D5DB" stroke-width="1.1"/>
    <!-- A — stroke path -->
    <path d="M5.5,16.5 L8,9.5 L10.5,16.5 M6.3,14 L9.7,14"
      fill="none" stroke="#111827" stroke-width="1.4"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 우하단 펄스 도트 -->
    <circle cx="16.5" cy="29.5" r="1.5" fill="#E53E3E">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 글로우 -->
    <circle cx="11" cy="20" r="7.5" fill="url(#liveGlow7)">
      <animate attributeName="r" values="7.5;9.5;7.5" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 메인 LIVE 도트 -->
    <circle cx="11" cy="20" r="4.8" fill="url(#liveDot7)">
      <animate attributeName="r" values="4.8;5.4;4.8" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <circle cx="9.4" cy="18.4" r="1.3" fill="#FFFFFF" opacity="0.68"/>
  </g>

  <!-- ══ "Holdem" — #111827 ══ -->

  <!-- H : 세로획 x=35,54  크로스바 y=25 -->
  <line x1="35" y1="11" x2="35" y2="38"
    stroke="#111827" stroke-width="10.5" stroke-linecap="round"/>
  <line x1="54" y1="11" x2="54" y2="38"
    stroke="#111827" stroke-width="10.5" stroke-linecap="round"/>
  <line x1="35" y1="25" x2="54" y2="25"
    stroke="#111827" stroke-width="8" stroke-linecap="round"/>

  <!-- o : cx=72, cy=28.5, r=9.5 -->
  <circle cx="72" cy="28.5" r="9.5"
    fill="none" stroke="#111827" stroke-width="10.5"/>

  <!-- l : x=90, 캡높이까지 -->
  <line x1="90" y1="11" x2="90" y2="38"
    stroke="#111827" stroke-width="10" stroke-linecap="round"/>

  <!-- d : 원 cx=108,cy=28.5,r=9  세로획 x=117.5 -->
  <circle cx="108" cy="28.5" r="9"
    fill="none" stroke="#111827" stroke-width="10.5"/>
  <line x1="117.5" y1="11" x2="117.5" y2="38"
    stroke="#111827" stroke-width="10.5" stroke-linecap="round"/>

  <!--
    e : cx=133, cy=28.5, r=9.5
    우상단 60° 열린 구조 (4시→1시30분 방향 반시계 300°)
    시작: 120° → x=133+9.5*cos(120°)=128.25, y=28.5+9.5*sin(120°)=36.73
    끝:  -30° → x=133+9.5*cos(-30°)=141.23, y=28.5+9.5*sin(-30°)=23.75
    large-arc=1, sweep=0 (반시계)
  -->
  <path d="M 128.25,36.73 A 9.5,9.5 0 1 0 141.23,23.75"
    fill="none" stroke="#111827" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- e 크로스바 -->
  <line x1="123" y1="28.5" x2="143" y2="28.5"
    stroke="#111827" stroke-width="7.5" stroke-linecap="round"/>

  <!-- m : 좌 세로획 + 2아치 + 중·우 세로획 -->
  <!-- 좌 세로획 x=154 -->
  <line x1="154" y1="19" x2="154" y2="38"
    stroke="#111827" stroke-width="10.5" stroke-linecap="round"/>
  <!-- 왼 아치 (좌획 상단→중간획 상단) -->
  <path d="M154,22 Q165.5,13 170,22"
    fill="none" stroke="#111827" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 중간 세로획 x=170 -->
  <line x1="170" y1="22" x2="170" y2="38"
    stroke="#111827" stroke-width="10.5" stroke-linecap="round"/>
  <!-- 오른 아치 -->
  <path d="M170,22 Q181.5,13 186,22"
    fill="none" stroke="#111827" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 우 세로획 x=186 -->
  <line x1="186" y1="22" x2="186" y2="38"
    stroke="#111827" stroke-width="10.5" stroke-linecap="round"/>

  <!-- ══ "Now" — #FF1F8F ══ -->

  <!-- N : 세로획 x=204,229  대각선 -->
  <line x1="204" y1="11" x2="204" y2="38"
    stroke="#FF1F8F" stroke-width="11" stroke-linecap="round"/>
  <line x1="229" y1="11" x2="229" y2="38"
    stroke="#FF1F8F" stroke-width="11" stroke-linecap="round"/>
  <line x1="204" y1="11" x2="229" y2="38"
    stroke="#FF1F8F" stroke-width="7.5" stroke-linecap="round"/>

  <!-- o : cx=248, cy=28.5 -->
  <circle cx="248" cy="28.5" r="9.5"
    fill="none" stroke="#FF1F8F" stroke-width="11"/>

  <!-- w : 5점 폴리라인, 우측 끝점 x=290 (LIVE 도트 위치) -->
  <polyline points="265,19 271.5,38 278,26.5 284.5,38 291,19"
    fill="none" stroke="#FF1F8F" stroke-width="10.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ LIVE 도트 — w 우상단 끝점 (x=291, y=19) ══ -->
  <!-- 글로우 (숨쉬기) -->
  <circle cx="291" cy="19" r="11" fill="url(#liveGlow7)">
    <animate attributeName="r" values="11;14.5;11" dur="2.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <!-- 도트 본체 -->
  <circle cx="291" cy="19" r="5.2" fill="url(#liveDot7)">
    <animate attributeName="r" values="5.2;5.9;5.2" dur="2.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <!-- 하이라이트 -->
  <circle cx="289.2" cy="17.2" r="1.6" fill="#FFFFFF" opacity="0.72"/>
</svg>

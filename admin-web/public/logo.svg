<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 44" width="248" height="44" role="img" aria-label="HoldemNow">
  <!--
    HoldemNow 워드마크 v6
    ─ 이름 변경: hold'emNow → HoldemNow (한 단어 PascalCase)
    ─ 심볼: 8° 기울인 에이스 카드 + 빨강 그라데이션 LIVE 도트 (v5 유지)
    ─ 폰트: Pretendard 800, letter-spacing -0.055em (v5 -0.045 대비 응집)
    ─ Holdem = #111827 (다크), Now = #FF1F8F (브랜드 핑크)
    ─ 흰 배경용 단일 SVG — 핑크 헤더용은 logo-white.svg 별도
  -->
  <defs>
    <!-- LIVE 도트 빨강 그라데이션 -->
    <radialGradient id="liveDotG6" cx="38%" cy="33%" r="65%">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="45%" stop-color="#E53E3E"/>
      <stop offset="100%" stop-color="#9B1C1C"/>
    </radialGradient>
    <!-- 도트 글로우 -->
    <radialGradient id="liveGlowG6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E53E3E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E53E3E" stop-opacity="0"/>
    </radialGradient>
    <!-- 카드 흰 광택 -->
    <linearGradient id="cardShineG6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
  </defs>

  <!-- ── 카드 심볼 (8° 기울임, 중심 10,22) ── -->
  <g transform="translate(10,22) rotate(8) translate(-10,-22)">
    <!-- 카드 본체 -->
    <rect x="1" y="5" width="18" height="27" rx="3.5"
      fill="url(#cardShineG6)" stroke="#D1D5DB" stroke-width="1.1"/>
    <!-- 좌상단 A -->
    <text x="3" y="12"
      font-family="'Pretendard', Georgia, serif"
      font-size="5.5" font-weight="900" letter-spacing="-0.03em"
      fill="#111827">A</text>
    <!-- 우하단 펄스 도트 -->
    <circle cx="15.5" cy="28" r="1.4" fill="#E53E3E">
      <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 글로우 배경 원 -->
    <circle cx="10" cy="19" r="7" fill="url(#liveGlowG6)">
      <animate attributeName="r" values="7;9;7" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 메인 LIVE 도트 -->
    <circle cx="10" cy="19" r="4.5" fill="url(#liveDotG6)">
      <animate attributeName="r" values="4.5;5.1;4.5" dur="2.0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <!-- 도트 하이라이트 -->
    <circle cx="8.6" cy="17.6" r="1.2" fill="#FFFFFF" opacity="0.68"/>
  </g>

  <!-- ── 워드마크 "Holdem" ── -->
  <text x="28" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.055em"
    fill="#111827">Holdem</text>

  <!-- ── 워드마크 "Now" 핑크 ── -->
  <text x="153" y="30"
    font-family="'Pretendard', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="24" font-weight="800" letter-spacing="-0.055em"
    fill="#FF1F8F">Now</text>
</svg>

# Firebase App Hosting 설정 — admin 백엔드 (본사 운영 콘솔)
#
# 사용법:
#   1) Firebase 콘솔 또는 CLI로 백엔드 신설(이름 권장: holdemnow-admin, region: us-east4)
#   2) 백엔드의 `apphosting.yaml` 경로를 `apphosting.admin.yaml`로 지정
#   3) 시크릿 등록 + 권한 부여:
#        firebase apphosting:secrets:grantaccess <secretName> --backend holdemnow-admin
#   4) URL 받으면 ALL 3개 yaml의 NEXT_PUBLIC_BACKEND_ADMIN_URL 채우기
#
# 이 백엔드의 역할(middleware로 enforce):
#   - 허용: /platform-login, /platform/*
#   - 차단: /m/*, /admin/*, /login/business, /signup/* (해당 백엔드로 redirect)
#   - root('/') → /platform-login 로 자동 redirect
#   - SEO: 전체 noindex + robots Disallow: /

runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_VARIANT
    value: admin
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_BACKEND_APP_URL
    value: "https://holdemnow--holdemnow-prod.us-east4.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_BACKEND_BIZ_URL
    value: "https://holdemnow-biz--holdemnow-prod.us-east4.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_BACKEND_ADMIN_URL
    value: "https://holdemnow-admin--holdemnow-prod.us-east4.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyC3WVSca1WpLk8O81cS8JqNWELBDj_Jocg
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN

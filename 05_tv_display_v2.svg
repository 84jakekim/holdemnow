<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Pretendard, sans-serif">
  <!-- 단순 블랙 (펠트 그린 X) -->
  <rect width="1280" height="720" fill="#0A0A0A"/>

  <!-- 상단 좌측: 매장 로고 + 이름 -->
  <g transform="translate(60, 50)">
    <!-- 매장 로고 (매장이 업로드한 것) -->
    <rect width="48" height="48" rx="10" fill="#1A1A1A"/>
    <text x="24" y="32" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">A</text>
    
    <text x="64" y="22" fill="#FFFFFF" font-size="18" font-weight="700">서면 ABC홀덤</text>
    <text x="64" y="42" fill="#767676" font-size="13">부산광역시 부산진구 서면로 23</text>
  </g>

  <!-- 상단 우측: 시계 -->
  <g transform="translate(1220, 50)">
    <text x="0" y="22" fill="#FFFFFF" font-size="22" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">21:34</text>
    <text x="0" y="42" fill="#767676" font-size="12" text-anchor="end">2026년 5월 13일 (수)</text>
  </g>

  <!-- 토너 이름 -->
  <text x="640" y="148" fill="#FFFFFF" font-size="32" font-weight="800" text-anchor="middle">프리징 90GTD</text>

  <!-- Level (작은 라벨) -->
  <text x="640" y="190" fill="#767676" font-size="14" text-anchor="middle" letter-spacing="6" font-weight="700">LEVEL 3</text>

  <!-- 거대 카운트다운 -->
  <text x="640" y="390" fill="#FFFFFF" font-size="220" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, monospace" letter-spacing="-10">14:32</text>

  <!-- 블라인드 -->
  <text x="640" y="450" fill="#767676" font-size="13" text-anchor="middle" letter-spacing="4" font-weight="600">BLINDS</text>
  <text x="640" y="510" fill="#FFFFFF" font-size="56" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">200 / 400</text>
  <text x="640" y="540" fill="#767676" font-size="18" text-anchor="middle" font-family="JetBrains Mono, monospace">Ante 50</text>

  <!-- Divider -->
  <line x1="120" y1="580" x2="1160" y2="580" stroke="#2A2A2A" stroke-width="1"/>

  <!-- 하단 정보 4개 -->
  <g transform="translate(0, 620)">
    <g transform="translate(180, 0)">
      <text x="0" y="0" fill="#767676" font-size="12" text-anchor="middle" letter-spacing="2" font-weight="600">PLAYERS</text>
      <text x="0" y="40" fill="#FFFFFF" font-size="34" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">14 / 32</text>
      <text x="0" y="62" fill="#767676" font-size="12" text-anchor="middle">2 테이블</text>
    </g>

    <g transform="translate(480, 0)">
      <text x="0" y="0" fill="#767676" font-size="12" text-anchor="middle" letter-spacing="2" font-weight="600">PRIZE POOL</text>
      <text x="0" y="40" fill="#FFFFFF" font-size="34" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">₩904,000</text>
      <text x="0" y="62" fill="#767676" font-size="12" text-anchor="middle">GTD 900,000</text>
    </g>

    <g transform="translate(800, 0)">
      <text x="0" y="0" fill="#767676" font-size="12" text-anchor="middle" letter-spacing="2" font-weight="600">LATE REG</text>
      <text x="0" y="40" fill="#FF4757" font-size="34" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">12:00</text>
      <text x="0" y="62" fill="#767676" font-size="12" text-anchor="middle">마감까지</text>
    </g>

    <g transform="translate(1100, 0)">
      <text x="0" y="0" fill="#767676" font-size="12" text-anchor="middle" letter-spacing="2" font-weight="600">NEXT</text>
      <text x="0" y="40" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">300 / 600</text>
      <text x="0" y="62" fill="#767676" font-size="12" text-anchor="middle">Lv 4</text>
    </g>
  </g>

  <!-- 우측 매장 토너 포스터 (매장이 업로드한 콘텐츠) -->
  <g transform="translate(1090, 180)">
    <rect width="130" height="172" rx="10" fill="#1A1A1A" stroke="#2A2A2A"/>
    <text x="65" y="22" fill="#767676" font-size="9" text-anchor="middle" letter-spacing="2">TONIGHT</text>
    <text x="65" y="50" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">FREEZE</text>
    <text x="65" y="68" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">90GTD</text>
    <line x1="35" y1="82" x2="95" y2="82" stroke="#767676" stroke-width="1"/>
    <text x="65" y="105" fill="#A8A8A8" font-size="10" text-anchor="middle">BUY-IN</text>
    <text x="65" y="128" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, monospace">50K</text>
    <text x="65" y="158" fill="#767676" font-size="9" text-anchor="middle">매장 자체 포스터</text>
  </g>

  <!-- Pink Rabbit 워터마크 (작게) -->
  <g transform="translate(60, 680)" opacity="0.4">
    <circle cx="4" cy="4" r="3" fill="#FF4757"/>
    <text x="14" y="9" fill="#FFFFFF" font-size="11" font-weight="600">Powered by Pink Rabbit</text>
  </g>
</svg>

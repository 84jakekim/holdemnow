// 선택된 세션의 컨트롤 (M3 단일 세션 컨트롤 UI를 sessionId 기반으로 재구성)
const SessionControls = ({sessionId}) => {
  const {
    sessions, slots, lateRegMinutes,
    togglePauseSession, nextLevelSession, prevLevelSession,
    addSecondsToSession, eliminatePlayerInSession, toggleLateRegInSession,
    stopSession, enterTvFullscreen,
  } = useLive();

  const session = sessions.find(s => s.id === sessionId);
  if (!session) return null;

  const isPaused = session.isPaused;
  const structure = session.blindStructure || DEFAULT_BLIND_STRUCTURE;
  const nextBlind = structure.find(l => l.level === session.currentLevel + 1);
  const lateMin = computeLateRegMinutes(session);
  const assignedSlot = slots.find(sl => sl.sessionId === sessionId);

  // 경과 시간 1초 갱신
  const [, force] = useState(0);
  useEffect(() => {
    const id = setInterval(() => force(n => n + 1), 1000);
    return () => clearInterval(id);
  }, []);
  const startedAt = session.startedAt ? new Date(session.startedAt) : null;
  const elapsed = startedAt ? Math.floor((new Date() - startedAt) / 1000) : 0;
  const elapsedStr = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;

  const timerStr = fmtTime(session.levelSecondsLeft);
  const timerColor = session.levelSecondsLeft <= 10 ? '#E53E3E' : (isPaused ? '#A8A8A8' : '#111');

  return (
    <div style={{padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: '12px', overflow: 'auto', flex: 1}}>
      {/* 상태 헤더 */}
      <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between'}}>
        <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
          <div style={{fontSize: '11px', fontWeight: 700, color: '#767676', letterSpacing: '0.04em'}}>
            {assignedSlot ? `슬롯 ${assignedSlot.slotNum} 송출 중` : '슬롯 미할당'}
          </div>
        </div>
        <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
          <div className="mono" style={{fontSize: '11px', color: '#767676', fontWeight: 600}}>경과 {elapsedStr}</div>
          <button onClick={() => enterTvFullscreen(assignedSlot?.slotNum)} className="panel-header-btn" title="매장 TV 디스플레이 풀스크린 송출">
            ⛶ TV 송출{assignedSlot ? ` · 슬롯 ${assignedSlot.slotNum}` : ''}
          </button>
        </div>
      </div>

      {/* 거대 타이머 */}
      <div style={{background: '#fff', border: '1.5px solid #EAEAEA', borderRadius: '14px', padding: '16px 14px', textAlign: 'center'}}>
        <div style={{fontSize: '11px', color: '#767676', fontWeight: 700, letterSpacing: '0.06em', marginBottom: '4px'}}>
          LEVEL {session.currentLevel} · {session.smallBlind}/{session.bigBlind}{session.ante ? ` · ante ${session.ante}` : ''}
        </div>
        <div className="mono" style={{fontSize: '56px', fontWeight: 800, color: timerColor, lineHeight: 1, letterSpacing: '-0.04em', transition: 'color 0.2s'}}>
          {timerStr}
        </div>
        {nextBlind && (
          <div style={{fontSize: '11px', color: '#A8A8A8', marginTop: '6px'}}>
            다음: Lv {nextBlind.level} · {nextBlind.sb}/{nextBlind.bb}
          </div>
        )}
      </div>

      {/* 컨트롤 그리드 */}
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px'}}>
        <button onClick={() => togglePauseSession(sessionId)} style={btnStyle(isPaused ? 'primary' : 'ghost', 46)}>
          {isPaused ? '▶ 재개' : '⏸ 일시정지'}
        </button>
        <button onClick={() => prevLevelSession(sessionId)} disabled={session.currentLevel <= 1} style={btnStyle('ghost', 46, session.currentLevel <= 1)}>
          ⏮ 이전
        </button>
        <button onClick={() => nextLevelSession(sessionId)} disabled={!nextBlind} style={btnStyle('ghost', 46, !nextBlind)}>
          ⏭ 다음
        </button>
        <button onClick={() => addSecondsToSession(sessionId, +60)} style={btnStyle('ghost', 42)}>+ 1분</button>
        <button onClick={() => addSecondsToSession(sessionId, -60)} disabled={session.levelSecondsLeft < 60} style={btnStyle('ghost', 42, session.levelSecondsLeft < 60)}>− 1분</button>
        <button onClick={() => eliminatePlayerInSession(sessionId)} disabled={session.playersRemaining <= 1} style={btnStyle('ghost', 42, session.playersRemaining <= 1)}>
          ✕ 탈락
        </button>
      </div>

      {/* 정보 박스 */}
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '6px'}}>
        <InfoBox label="잔여 인원" value={`${session.playersRemaining}/${session.totalPlayers}명`} />
        <InfoBox label="상금 풀" value={`₩${(session.prizePool / 10000).toFixed(0)}만`} />
        <InfoBox
          label={session.lateRegClosed ? '늦은 등록' : '등록 마감까지'}
          value={session.lateRegClosed ? '마감됨' : `${lateMin}분`}
          warn={!session.lateRegClosed && lateMin <= 5}
        />
        <InfoBox label="시청자" value={`${session.viewers}명`} />
      </div>

      {/* 보조 액션 */}
      <div style={{display: 'flex', gap: '6px'}}>
        <button onClick={() => toggleLateRegInSession(sessionId)} style={{...btnStyle('ghost', 38), flex: 1, fontSize: '12px'}}>
          {session.lateRegClosed ? '등록 재오픈' : '늦은 등록 마감'}
        </button>
        <button onClick={() => stopSession(sessionId)} style={{...btnStyle('danger', 38), flex: 1, fontSize: '12px'}}>
          ■ 이 세션 종료
        </button>
      </div>
    </div>
  );
};

// ==================== SLOT MANAGER (M10) ====================
const SlotManager = () => {
  const {slots, sessions, setSlotSession, addSlot, removeSlot, enterTvFullscreen} = useLive();
  const [openMenuFor, setOpenMenuFor] = useState(null);

  return (
    <div className="slot-manager">
      <div className="slot-manager-title">
        <div className="slot-manager-title-text">📺 디스플레이 슬롯 (TV 송출 매핑)</div>
        <button className="slot-manager-add" onClick={addSlot}>+ 슬롯 추가</button>
      </div>
      <div className="slot-list">
        {slots.map(slot => (
          <SlotCard
            key={slot.slotNum}
            slot={slot}
            session={slot.sessionId ? sessions.find(s => s.id === slot.sessionId) : null}
            allSessions={sessions}
            menuOpen={openMenuFor === slot.slotNum}
            onToggleMenu={() => setOpenMenuFor(openMenuFor === slot.slotNum ? null : slot.slotNum)}
            onAssign={(sessionId) => { setSlotSession(slot.slotNum, sessionId); setOpenMenuFor(null); }}
            onCast={() => enterTvFullscreen(slot.slotNum)}
            onRemove={() => removeSlot(slot.slotNum)}
            canRemove={slots.length > 1}
          />
        ))}
      </div>
    </div>
  );
};

const SlotCard = ({slot, session, allSessions, menuOpen, onToggleMenu, onAssign, onCast, onRemove, canRemove}) => {
  const empty = !session;
  return (
    <div className={`slot-card ${empty ? 'empty' : ''}`} style={{position: 'relative'}}>
      <div className="slot-card-num">슬롯 {slot.slotNum}</div>
      <div className="slot-card-session" style={{color: empty ? '#A8A8A8' : '#111'}}>
        {empty ? '비어있음' : session.tournamentName}
      </div>
      {!empty && (
        <div className="slot-card-meta">
          {session.isPaused ? '⏸ ' : ''}{fmtTime(session.levelSecondsLeft || 0)} · Lv {session.currentLevel}
        </div>
      )}
      <div className="slot-card-actions">
        <button onClick={onToggleMenu}>{empty ? '+ 할당' : '▼ 변경'}</button>
        <button className="primary" onClick={onCast} title="이 디바이스를 이 슬롯으로 송출">⛶ TV</button>
        {canRemove && empty && <button className="danger" onClick={onRemove}>✕</button>}
      </div>
      {menuOpen && (
        <div className="slot-assign-menu">
          {allSessions.length === 0 && (
            <div style={{padding: '8px 10px', fontSize: '11px', color: '#767676'}}>
              진행 중인 세션이 없습니다
            </div>
          )}
          {allSessions.map(s => (
            <button key={s.id} className="slot-assign-menu-item" onClick={() => onAssign(s.id)}>
              {s.id === slot.sessionId ? '✓ ' : ''}{s.tournamentName} · Lv {s.currentLevel}
            </button>
          ))}
          {!empty && (
            <button className="slot-assign-menu-item clear" onClick={() => onAssign(null)}>
              슬롯 비우기
            </button>
          )}
        </div>
      )}
    </div>
  );
};

// 어드민 버튼 공통 스타일
const btnStyle = (variant, height, disabled) => {
  const base = {
    height: `${height}px`,
    border: 'none',
    borderRadius: '12px',
    fontSize: variant === 'primary' ? '16px' : '13px',
    fontWeight: 700,
    letterSpacing: '0.01em',
    cursor: disabled ? 'not-allowed' : 'pointer',
    transition: 'all 0.15s',
    opacity: disabled ? 0.4 : 1,
  };
  if (variant === 'primary') return {...base, background: '#E53E3E', color: '#fff'};
  if (variant === 'danger') return {...base, background: '#fff', color: '#E53E3E', border: '1.5px solid #E53E3E'};
  return {...base, background: '#fff', color: '#111', border: '1.5px solid #EAEAEA'};
};

const InfoBox = ({label, value, warn}) => (
  <div style={{
    background: '#fff',
    border: `1px solid ${warn ? '#FECACA' : '#EAEAEA'}`,
    borderRadius: '10px',
    padding: '10px 12px',
  }}>
    <div style={{fontSize: '10px', color: '#767676', fontWeight: 600, marginBottom: '3px'}}>{label}</div>
    <div className="mono" style={{fontSize: '14px', fontWeight: 800, color: warn ? '#E53E3E' : '#111'}}>{value}</div>
  </div>
);


// ==================== TV DISPLAY (M10 — 슬롯/세션 기반) ====================
// slotNum이 주어지면 그 슬롯에 매핑된 세션, sessionId가 주어지면 그 세션,
// 둘 다 없으면 첫 세션 (legacy).
const TvDisplayContent = ({slotNum, sessionId}) => {
  const {sessions, slots} = useLive();
  let session;
  if (sessionId) {
    session = sessions.find(s => s.id === sessionId);
  } else if (slotNum != null) {
    const slot = slots.find(s => s.slotNum === slotNum);
    session = slot?.sessionId ? sessions.find(s => s.id === slot.sessionId) : null;
  } else {
    session = sessions[0];
  }
  const isLive = !!session;
  const isPaused = session?.isPaused ?? false;
  const lateRegMinutes = computeLateRegMinutes(session);
  const nextBlind = session
    ? (session.blindStructure || DEFAULT_BLIND_STRUCTURE).find(l => l.level === session.currentLevel + 1)
    : null;

  if (!isLive) {
    return (
      <div style={{textAlign: 'center', color: '#A8A8A8'}}>
        <div style={{fontSize: '14px', fontWeight: 600, color: '#767676', marginBottom: '12px', letterSpacing: '0.04em'}}>
          서면 ABC홀덤
        </div>
        <div style={{fontSize: '48px', fontWeight: 800, color: '#3A3A3A', marginBottom: '20px', letterSpacing: '-0.02em'}}>
          대기 중
        </div>
        <div style={{fontSize: '12px', color: '#5A5A5A', lineHeight: 1.6}}>
          어드민에서 LIVE 시작 시<br/>
          이 화면에 토너 정보가 표시됩니다
        </div>
      </div>
    );
  }

  const timerStr = fmtTime(session.levelSecondsLeft);
  const lowTime = session.levelSecondsLeft <= 10;

  return (
    <div style={{width: '100%', textAlign: 'center', color: '#fff'}}>
      {/* 상단: 토너명 + LIVE/일시정지 표시 */}
      <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px', marginBottom: '8px'}}>
        <div className={isPaused ? '' : 'pulse-dot'} style={{width: 10, height: 10, borderRadius: '50%', background: isPaused ? '#FFB800' : '#E53E3E'}}></div>
        <div style={{fontSize: '11px', color: isPaused ? '#FFB800' : '#E53E3E', fontWeight: 800, letterSpacing: '0.12em'}}>
          {isPaused ? 'PAUSED' : 'LIVE'}
        </div>
      </div>
      <div style={{fontSize: '12px', color: '#A8A8A8', marginBottom: '2px'}}>서면 ABC홀덤</div>
      <div className="serif" style={{fontSize: '28px', fontWeight: 900, marginBottom: '16px', letterSpacing: '-0.02em'}}>
        {session.tournamentName}
      </div>

      {/* 거대 카운트다운 */}
      <div style={{background: '#1A1A1A', border: `1.5px solid ${lowTime ? '#E53E3E' : '#2A2A2A'}`, borderRadius: '18px', padding: '24px 16px', marginBottom: '12px', transition: 'border-color 0.2s'}}>
        <div style={{fontSize: '11px', color: '#767676', fontWeight: 700, letterSpacing: '0.1em', marginBottom: '8px'}}>
          LEVEL {session.currentLevel}
        </div>
        <div className="mono" style={{
          fontSize: '78px', fontWeight: 800,
          color: lowTime ? '#E53E3E' : '#fff',
          letterSpacing: '-0.04em', lineHeight: 1,
          transition: 'color 0.2s',
        }}>
          {timerStr}
        </div>
        <div className="mono" style={{fontSize: '20px', fontWeight: 800, color: '#FFB800', marginTop: '10px', letterSpacing: '-0.01em'}}>
          {session.smallBlind}/{session.bigBlind}{session.ante ? ` (a${session.ante})` : ''}
        </div>
      </div>

      {/* 세 가지 stat */}
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px', marginBottom: '12px'}}>
        <TvStat label="잔여 인원" value={`${session.playersRemaining}/${session.totalPlayers}`} />
        <TvStat label="상금 풀" value={`₩${(session.prizePool / 10000).toFixed(0)}만`} />
        <TvStat
          label="등록 마감"
          value={session.lateRegClosed ? '마감' : `${lateRegMinutes}분`}
          highlight={!session.lateRegClosed && lateRegMinutes <= 5}
        />
      </div>

      {/* 다음 레벨 미리보기 */}
      {nextBlind ? (
        <div style={{fontSize: '11px', color: '#5A5A5A', marginBottom: '12px'}}>
          NEXT · Lv {nextBlind.level} · <span className="mono">{nextBlind.sb}/{nextBlind.bb}</span>{nextBlind.ante ? <span className="mono"> · a{nextBlind.ante}</span> : null}
        </div>
      ) : (
        <div style={{fontSize: '11px', color: '#5A5A5A', marginBottom: '12px'}}>FINAL LEVEL</div>
      )}

      <div style={{fontSize: '10px', color: '#5A5A5A'}}>
        ● Pink Rabbit · display.holdemnow.com
      </div>
    </div>
  );
};

const TvStat = ({label, value, highlight}) => (
  <div style={{background: '#1A1A1A', border: '1px solid #2A2A2A', borderRadius: '10px', padding: '12px 8px'}}>
    <div style={{fontSize: '9px', color: '#767676', fontWeight: 700, letterSpacing: '0.06em', marginBottom: '4px'}}>{label}</div>
    <div className="mono" style={{fontSize: '16px', fontWeight: 800, color: highlight ? '#E53E3E' : '#fff'}}>{value}</div>
  </div>
);

// ==================== DEMO STAGE (전체 무대) ====================
const Panel = ({icon, title, subtitle, badge, bodyClass, headerExtra, children}) => (
  <div className="panel">
    <div className="panel-header">
      <div className="panel-title-group">
        <div className="panel-icon">{icon}</div>
        <div>
          <div className="panel-title">{title}</div>
          <div className="panel-subtitle">{subtitle}</div>
        </div>
      </div>
      <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
        {headerExtra}
        <div className="panel-badge">{badge}</div>
      </div>
    </div>
    <div className={`panel-body ${bodyClass || ''}`}>
      {children}
    </div>
  </div>
);

// TV 패널 헤더의 풀스크린 진입 버튼
const TvFullscreenTrigger = () => {
  const {enterTvFullscreen} = useLive();
  return (
    <button className="panel-header-btn" onClick={enterTvFullscreen} title="매장 TV 풀스크린 모드">
      ⛶ 풀스크린
    </button>
  );
};

// TV 풀스크린 overlay — 매장 TV 환경 시뮬레이션
const TvFullscreenOverlay = () => {
  const {exitTvFullscreen, tvSlotNum, store} = useLive();
  const slotLabel = tvSlotNum != null
    ? `슬롯 ${tvSlotNum} 송출 · display.holdemnow.com/${store.storeId}/slot/${tvSlotNum}`
    : '미리보기 (슬롯 미지정)';
  return (
    <div className="tv-fs-overlay">
      <div className="tv-fs-content">
        <TvDisplayContent slotNum={tvSlotNum} />
      </div>
      <button className="tv-fs-close" onClick={exitTvFullscreen}>✕ 닫기 (ESC)</button>
      <div className="tv-fs-hint">
        {slotLabel}<br/>
        실제 매장에서는 매장 TV가 자기 슬롯 URL을 열어 풀스크린으로 사용
      </div>
      <div className="tv-fs-corner">
        <div className="pulse-dot" style={{width: 8, height: 8, borderRadius: '50%', background: '#E53E3E'}}></div>
        Pink Rabbit · {store.storeName}
      </div>
    </div>
  );
};

const PlaybackBanner = () => {
  const {playback, stopPlayback} = useLive();
  // 1초마다 progress 갱신
  const [, force] = useState(0);
  const startedAtRef = useRef(Date.now());
  useEffect(() => {
    startedAtRef.current = Date.now();
    const id = setInterval(() => force(n => n + 1), 250);
    return () => clearInterval(id);
  }, []);

  const elapsed = Date.now() - startedAtRef.current;
  const pct = Math.min(100, (elapsed / DEMO_TOTAL_MS) * 100);
  const stepLabel = playback.step >= 0
    ? String(playback.step + 1).padStart(2, '0')
    : '00';

  return (
    <div className="playback-banner">
      <div className="playback-step-num">{stepLabel}</div>
      <div className="playback-caption">{playback.caption}</div>
      <div className="playback-progress">
        <div className="playback-progress-fill" style={{width: `${pct}%`}}></div>
      </div>
      <button className="playback-stop" onClick={stopPlayback}>■ 중지</button>
    </div>
  );
};

const DemoStageInner = () => {
  const {isTvFullscreen, playback, startPlayback, currentRole, store, organizer} = useLive();
  const playbackRunning = playback.running;
  const adminTitle = currentRole === 'organizer' ? '대회사 어드민' : '매장 어드민';
  const adminSubtitle = currentRole === 'organizer'
    ? `${organizer.organizerName} · admin.holdemnow.com`
    : `${store.storeName} · admin.holdemnow.com`;
  const adminIcon = currentRole === 'organizer' ? '🏆' : '🎛';
  const adminBadge = currentRole === 'organizer' ? 'B2B+' : 'B2B';

  return (
    <>
      <div className="demo-stage">
        <div className="demo-header">
          <div className="demo-brand">
            <div className="demo-brand-dot"></div>
            <div className="demo-brand-name">Pink Rabbit</div>
            <div className="demo-version">데모 v0.7 · M19 대회사 어드민</div>
          </div>
          <div className="demo-header-right">
            <RoleToggle />
            <button
              className="demo-action-btn primary"
              onClick={startPlayback}
              disabled={playbackRunning}
              style={playbackRunning ? {opacity: 0.4, cursor: 'not-allowed'} : {}}
            >
              ▶ 자동 시연
            </button>
            <button className="demo-action-btn" onClick={() => window.open(window.location.href, '_blank')}>
              ↗ 새 창
            </button>
            <button className="demo-action-btn danger" onClick={() => {
              if (!window.confirm('데모 상태를 초기화하고 새로고침합니다.')) return;
              try { localStorage.removeItem(STORAGE_KEY); } catch {}
              window.location.reload();
            }}>
              ↺ 초기화
            </button>
          </div>
        </div>

        <div className="narrow-notice">
          💡 이 데모는 1280px 이상 가로 화면에 최적화돼 있습니다. 현재 너비에서는 패널이 세로로 정렬됩니다.
        </div>

        {playbackRunning && <PlaybackBanner />}

        <div style={{position: 'relative'}}>
          <Panel icon={adminIcon} title={adminTitle} subtitle={adminSubtitle} badge={adminBadge}>
            <AdminPanelContent />
          </Panel>
          {playbackRunning && (
            <div className="playback-lockout">
              <div className="playback-lockout-text">🎬 자동 시연 진행 중 · 어드민 조작 비활성</div>
            </div>
          )}
        </div>

        <Panel
          icon="📺"
          title="매장 TV 디스플레이 · 슬롯 1"
          subtitle="display.holdemnow.com/bsn_001/slot/1"
          badge="TV"
          bodyClass="tv"
        >
          <TvDisplayContent slotNum={1} />
        </Panel>

        <Panel icon="📱" title="모바일 앱" subtitle="플레이어 · iOS/Android" badge="B2C" bodyClass="mobile">
          <div className="phone-frame">
            <div className="phone-notch"></div>
            <div className="phone-screen">
              <App />
            </div>
          </div>
        </Panel>
      </div>
      {isTvFullscreen && <TvFullscreenOverlay />}
    </>
  );
};

const DemoStage = () => (
  <LiveStateProvider>
    <DemoStageInner />
  </LiveStateProvider>
);

// ==================== APP ====================
const App = () => {
  const [view, setView] = useState({type: 'home', data: null});
  const [tab, setTab] = useState('home');

  const navigate = (type, data) => {
    setView({type, data});
  };

  const goBack = () => {
    setView({type: tab, data: null});
  };

  const switchTab = (newTab) => {
    setTab(newTab);
    setView({type: newTab, data: null});
  };

  const renderScreen = () => {
    if (view.type === 'store') return <StoreDetailScreen storeId={view.data} onNavigate={navigate} onBack={goBack} />;
    if (view.type === 'live') return <LiveFullscreenScreen liveId={view.data} onClose={goBack} />;
    if (view.type === 'series') return <SeriesScreen seriesId={view.data} onNavigate={navigate} onBack={goBack} />;

    if (tab === 'home') return <HomeScreen onNavigate={navigate} />;
    if (tab === 'discover') return <MapScreen onNavigate={navigate} />;
    if (tab === 'calendar') return <CalendarScreen onNavigate={navigate} />;
    if (tab === 'favorites') return <FavoritesScreen onNavigate={navigate} />;
    if (tab === 'my') return <MyPageScreen onNavigate={navigate} />;
    return <HomeScreen onNavigate={navigate} />;
  };

  const showTabBar = view.type !== 'live' && view.type !== 'store' && view.type !== 'series';

  return (
    <div style={{height: '100%', display: 'flex', flexDirection: 'column', position: 'relative'}}>
      <StatusBar />
      <div style={{flex: 1, overflow: 'hidden', position: 'relative'}}>
        {renderScreen()}
      </div>
      {showTabBar && <TabBar active={tab} onChange={switchTab} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<DemoStage />);
</script>

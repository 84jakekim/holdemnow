<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Rabbit · 앱 프로토타입</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
  body {
    background: linear-gradient(135deg, #FAFAFA 0%, #F0F0F0 100%);
    min-height: 100vh;
  }

  /* ===== Demo Stage (3-Panel Layout) ===== */
  .demo-stage {
    min-height: 100vh;
    padding: 28px 28px 40px;
    display: grid;
    grid-template-columns: minmax(360px, 1fr) minmax(520px, 1.4fr) 414px;
    gap: 24px;
    align-items: start;
  }
  .demo-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 8px;
  }
  .demo-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .demo-brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #E53E3E;
    box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.6);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  .demo-brand-name {
    font-size: 18px; font-weight: 800; color: #111; letter-spacing: -0.02em;
  }
  .demo-version {
    font-size: 11px; color: #767676; font-weight: 600;
    padding: 4px 10px; background: #fff; border-radius: 999px;
    border: 1px solid #eaeaea;
  }
  .demo-tagline {
    font-size: 12px; color: #767676;
  }
  .demo-header-right {
    display: flex; align-items: center; gap: 14px;
  }
  .demo-action-btn {
    background: #fff;
    border: 1px solid #EAEAEA;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    color: #111;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    letter-spacing: 0.02em;
    transition: all 0.15s;
  }
  .demo-action-btn:hover {
    background: #F4F4F4;
    border-color: #D8D8D8;
  }
  .demo-action-btn.danger { color: #E53E3E; border-color: #FECACA; }
  .demo-action-btn.danger:hover { background: #FEF2F2; }
  .demo-action-btn.primary {
    background: #111; color: #fff; border-color: #111;
  }
  .demo-action-btn.primary:hover { background: #000; }

  /* Role Toggle (M19) */
  .role-toggle {
    display: inline-flex;
    background: #fff;
    border: 1px solid #EAEAEA;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .role-toggle button {
    background: none;
    border: none;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #767676;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .role-toggle button.active {
    background: #111;
    color: #fff;
  }
  .role-toggle button:not(.active):hover { background: #F4F4F4; color: #111; }

  /* 시리즈 카드 */
  .series-card {
    background: #fff;
    border: 1px solid #EAEAEA;
    border-radius: 14px;
    overflow: hidden;
  }
  .series-poster {
    height: 90px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #fff;
  }
  .series-status-pill {
    display: inline-flex;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.04em;
    align-self: flex-start;
  }
  .series-status-pill.active { background: #00B074; }
  .series-status-pill.upcoming { background: #FFB800; color: #111; }
  .series-status-pill.completed { background: rgba(0,0,0,0.4); }
  .series-card-name {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .series-card-body {
    padding: 12px 14px;
  }
  .series-card-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: #767676;
    margin-bottom: 10px;
  }
  .series-card-meta .row { display: flex; justify-content: space-between; }
  .series-card-meta .val { color: #111; font-weight: 600; }
  .series-card-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 8px 0;
    border-top: 1px solid #F4F4F4;
    margin-bottom: 8px;
  }
  .series-stat { text-align: center; }
  .series-stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 800;
    color: #111;
  }
  .series-stat-label { font-size: 9px; color: #767676; margin-top: 2px; }
  .series-card-actions {
    display: flex;
    gap: 6px;
  }
  .series-card-actions button {
    flex: 1;
    background: #fff;
    border: 1px solid #EAEAEA;
    border-radius: 8px;
    padding: 6px;
    font-size: 11px;
    font-weight: 700;
    color: #111;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
  }
  .series-card-actions button:hover { background: #F4F4F4; }
  .series-card-actions button.danger { color: #E53E3E; border-color: #FECACA; }

  /* 협력 매장 그리드 */
  .partner-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .partner-row {
    background: #fff;
    border: 1px solid #EAEAEA;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .partner-photo {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  /* 일괄 홍보 발송 */
  .broadcast-panel {
    background: #111;
    color: #fff;
    border-radius: 14px;
    padding: 16px;
  }

  /* ===== 매장 가입 마법사 (M21) ===== */
  .wizard-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    animation: fadeIn 0.2s ease-out;
  }
  .wizard-modal {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    max-height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .wizard-header {
    padding: 16px 18px 10px;
    border-bottom: 1px solid #EAEAEA;
  }
  .wizard-step-pills {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }
  .wizard-step-pill {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #EAEAEA;
    transition: all 0.3s;
  }
  .wizard-step-pill.active { background: #E53E3E; }
  .wizard-step-pill.done { background: #111; }
  .wizard-step-label {
    font-size: 10px;
    color: #767676;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .wizard-step-title {
    font-size: 17px;
    font-weight: 800;
    color: #111;
    letter-spacing: -0.01em;
  }
  .wizard-step-desc {
    font-size: 11px;
    color: #767676;
    margin-top: 2px;
  }
  .wizard-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .wizard-footer {
    padding: 12px 18px;
    border-top: 1px solid #EAEAEA;
    display: flex;
    gap: 8px;
  }
  .wizard-footer button {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    border: none;
  }
  .wizard-footer button.back { background: #fff; color: #111; border: 1.5px solid #EAEAEA; }
  .wizard-footer button.next { background: #111; color: #fff; }
  .wizard-footer button:disabled { opacity: 0.4; cursor: not-allowed; }

  .facility-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid #EAEAEA;
    background: #fff;
    font-size: 12px;
    color: #111;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
    font-family: 'Pretendard', sans-serif;
  }
  .facility-chip.active {
    background: #111;
    color: #fff;
    border-color: #111;
  }

  .photo-upload-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .photo-slot {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1.5px dashed #D0D0D0;
    background: #F7F7F7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #767676;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .photo-slot:hover { background: #EFEFEF; border-color: #767676; color: #111; }
  .photo-slot.filled { border-style: solid; border-color: transparent; }
  .photo-slot .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    z-index: 2;
  }

  /* 카카오 주소 모의 검색 결과 */
  .addr-result {
    background: #fff;
    border: 1px solid #EAEAEA;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .addr-result:hover { background: #F4F4F4; }
  .addr-result-main { font-size: 13px; font-weight: 700; color: #111; }
  .addr-result-sub { font-size: 11px; color: #767676; margin-top: 2px; }

  /* ===== Playback Banner (M6) ===== */
  .playback-banner {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #111 0%, #2A2A2A 100%);
    color: #fff;
    border-radius: 14px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    animation: fadeIn 0.3s ease-out;
  }
  .playback-step-num {
    background: rgba(255,255,255,0.1);
    color: #fff;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .playback-caption {
    flex: 1;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .playback-progress {
    flex-shrink: 0;
    width: 120px;
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    overflow: hidden;
  }
  .playback-progress-fill {
    height: 100%;
    background: #E53E3E;
    border-radius: 999px;
    transition: width 0.3s linear;
  }
  .playback-stop {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    letter-spacing: 0.02em;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .playback-stop:hover { background: rgba(255,255,255,0.2); }

  /* 시연 중 어드민 위 overlay */
  .playback-lockout {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: all;
    cursor: not-allowed;
  }
  .playback-lockout-text {
    background: #111;
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .panel {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid #eaeaea;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
  }
  .panel-title-group { display: flex; align-items: center; gap: 8px; }
  .panel-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: #F4F4F4;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .panel-title {
    font-size: 13px; font-weight: 700; color: #111; letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .panel-subtitle {
    font-size: 11px; color: #767676; margin-top: 2px;
  }
  .panel-badge {
    font-size: 10px; font-weight: 700; color: #767676;
    padding: 3px 8px; background: #F4F4F4; border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .panel-body {
    flex: 1;
    min-height: 820px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAFA;
  }
  .panel-body.mobile {
    background: linear-gradient(180deg, #F4F4F4 0%, #EAEAEA 100%);
    padding: 20px 12px;
    align-items: flex-start;
  }
  .panel-body.tv {
    background: #0A0A0A;
    padding: 28px;
  }

  /* Placeholder content inside empty panels */
  .placeholder {
    text-align: center;
    color: #A8A8A8;
    padding: 40px 24px;
  }
  .placeholder-emoji {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.6;
  }
  .placeholder-title {
    font-size: 14px;
    font-weight: 700;
    color: #767676;
    margin-bottom: 6px;
  }
  .placeholder-text {
    font-size: 12px;
    color: #A8A8A8;
    line-height: 1.6;
  }
  .placeholder.tv {
    color: #767676;
  }
  .placeholder.tv .placeholder-title { color: #A8A8A8; }
  .placeholder.tv .placeholder-text { color: #767676; }

  /* Narrow viewport notice */
  .narrow-notice {
    display: none;
    grid-column: 1 / -1;
    padding: 14px 18px;
    background: #FFF7E6;
    border: 1px solid #FFE5A3;
    border-radius: 12px;
    color: #7A5A00;
    font-size: 12px;
    line-height: 1.6;
  }

  @media (max-width: 1279px) {
    .demo-stage {
      grid-template-columns: 1fr;
      padding: 16px;
    }
    .narrow-notice { display: block; }
    .panel-body { min-height: 480px; }
  }

  /* ===== TV Fullscreen Overlay ===== */
  .tv-fs-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease-out;
  }
  .tv-fs-content {
    width: 540px;
    transform-origin: center center;
  }
  /* viewport에 맞춰 scale 자동 조절 */
  @media (min-height: 720px) and (min-width: 1280px) {
    .tv-fs-content { transform: scale(1.9); }
  }
  @media (min-height: 900px) and (min-width: 1600px) {
    .tv-fs-content { transform: scale(2.3); }
  }
  @media (min-height: 1080px) and (min-width: 1920px) {
    .tv-fs-content { transform: scale(2.7); }
  }
  .tv-fs-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Pretendard', sans-serif;
    letter-spacing: 0.02em;
    transition: background 0.15s;
  }
  .tv-fs-close:hover { background: rgba(255,255,255,0.16); }
  .tv-fs-hint {
    position: absolute;
    bottom: 24px;
    left: 24px;
    color: #5A5A5A;
    font-size: 11px;
    line-height: 1.5;
  }
  .tv-fs-corner {
    position: absolute;
    bottom: 24px;
    right: 24px;
    color: #5A5A5A;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== Admin 멀티 세션 UI (M8) ===== */
  .session-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 14px;
    border-bottom: 1px solid #EAEAEA;
    background: #FAFAFA;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .session-tabs::-webkit-scrollbar { height: 4px; }
  .session-tabs::-webkit-scrollbar-thumb { background: #D0D0D0; border-radius: 2px; }

  .session-tab {
    background: #fff;
    border: 1.5px solid #EAEAEA;
    border-radius: 10px;
    padding: 8px 12px;
    min-width: 132px;
    flex-shrink: 0;
    cursor: pointer;
    text-align: left;
    font-family: 'Pretendard', sans-serif;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .session-tab:hover { border-color: #D0D0D0; }
  .session-tab.active {
    border-color: #111;
    background: #111;
    color: #fff;
  }
  .session-tab-top {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .session-tab-name {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  .session-tab-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .session-tab-meta {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.7;
  }
  .session-tab-add {
    background: #fff;
    border: 1.5px dashed #C8C8C8;
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 110px;
    flex-shrink: 0;
    cursor: pointer;
    color: #767676;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Pretendard', sans-serif;
    transition: all 0.15s;
  }
  .session-tab-add:hover {
    background: #F4F4F4;
    border-color: #767676;
    color: #111;
  }

  /* 새 LIVE 시작 모달 */
  .new-live-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.15s ease-out;
  }
  .new-live-modal {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .new-live-modal h3 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 800;
    color: #111;
    letter-spacing: -0.01em;
  }
  .new-live-modal p {
    margin: 0 0 16px;
    font-size: 12px;
    color: #767676;
  }
  .template-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1.5px solid #EAEAEA;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
  }
  .template-option:hover { border-color: #111; background: #FAFAFA; }
  .template-poster-mini {
    width: 44px;
    height: 58px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .template-option-info { flex: 1; }

const loadPersistedState = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    let sessions = Array.isArray(p.sessions) ? p.sessions : [];
    // 마지막 저장 이후 흐른 시간만큼 각 세션의 levelSecondsLeft 차감 (일시정지 아닌 세션만)
    if (p.lastSavedAt && sessions.length > 0) {
      const elapsedSec = Math.max(0, Math.floor((Date.now() - p.lastSavedAt) / 1000));
      sessions = sessions.map(s => {
        if (s.isPaused) return s;
        return {...s, levelSecondsLeft: Math.max(0, (s.levelSecondsLeft || 0) - elapsedSec)};
      });
    }
    return {
      sessions,
      slots: Array.isArray(p.slots) ? p.slots : INITIAL_SLOTS,
    };
  } catch { return null; }
};

const INITIAL_SLOTS = [
  {slotNum: 1, sessionId: null},
  {slotNum: 2, sessionId: null},
];

// 현재 레벨에서 late reg 마감까지 남은 분 (자체 blindStructure + lateRegEndLevel 사용)
const computeLateRegMinutes = (session) => {
  if (!session) return 0;
  if (session.lateRegClosed) return 0;
  const endLv = session.lateRegEndLevel || 5;
  if (session.currentLevel > endLv) return 0;
  const structure = session.blindStructure || DEFAULT_BLIND_STRUCTURE;
  // 현재 레벨 잔여 시간 + 이후 레벨들의 duration 합 (endLv까지)
  let totalSec = session.levelSecondsLeft;
  for (let lv = session.currentLevel + 1; lv <= endLv; lv++) {
    const item = structure.find(s => s.level === lv) || structure[lv - 1];
    if (item) totalSec += item.duration || DEMO_LEVEL_DURATION;
  }
  return Math.ceil(totalSec / 60);
};

const LiveStateProvider = ({children}) => {
  // 초기 상태: localStorage에서 복원, 없으면 빈 시드
  const persistedRef = useRef(loadPersistedState());
  const p = persistedRef.current;

  const [sessions, setSessions] = useState(p?.sessions ?? []);
  const [slots, setSlots] = useState(p?.slots ?? INITIAL_SLOTS);
  const [isTvFullscreen, setIsTvFullscreen] = useState(false);
  const [tvSlotNum, setTvSlotNum] = useState(null);  // 풀스크린 중인 슬롯 번호 (null이면 슬롯 미지정 - 대기 미리보기)
  // 토너 템플릿 (M18) — localStorage 별도 키 사용
  const [customTemplates, setCustomTemplates] = useState(() => {
    try {
      const raw = localStorage.getItem(TEMPLATES_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch {}
    return SEED_TEMPLATES;
  });

  // customTemplates 변경 시 localStorage 저장
  useEffect(() => {
    try { localStorage.setItem(TEMPLATES_KEY, JSON.stringify(customTemplates)); } catch {}
  }, [customTemplates]);

  // 역할 + 시리즈 (M19)
  const [currentRole, setCurrentRole] = useState('store');  // 'store' | 'organizer'
  const [series, setSeries] = useState(() => {
    try {
      const raw = localStorage.getItem(SERIES_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch {}
    return SEED_SERIES;
  });
  const [finalists, setFinalists] = useState(SEED_FINALISTS);

  useEffect(() => {
    try { localStorage.setItem(SERIES_KEY, JSON.stringify(series)); } catch {}
  }, [series]);

  // 호환성 alias — M8 이전 컴포넌트가 단일 session으로 다루는 표면
  const session = sessions[0] || null;
  const isLive = sessions.length > 0;
  const isPaused = session?.isPaused ?? false;
  const startedAt = session?.startedAt ? new Date(session.startedAt) : null;

  // BroadcastChannel — 다른 탭/창과 동기화
  const channelRef = useRef(null);
  const isReceivingRef = useRef(false);  // 받은 메시지로 setState한 경우 표시 (re-broadcast 방지)
  const isTickRef = useRef(false);       // 1초 카운트다운 tick은 broadcast 안 함 (race 방지)
  const isInitialMountRef = useRef(true); // 초기 마운트 broadcast skip

  // ==================== 자동 시연 (M6) — 상태 ====================
  const [playback, setPlayback] = useState({running: false, caption: '', step: -1});
  const playbackTimersRef = useRef([]);

  // BroadcastChannel 수신 + storage 이벤트 백업
  useEffect(() => {
    if (typeof BroadcastChannel !== 'undefined') {
      const ch = new BroadcastChannel(CHANNEL_NAME);
      channelRef.current = ch;
      ch.onmessage = (e) => {
        if (!e.data || e.data.type !== 'state') return;
        const d = e.data.payload;
        isReceivingRef.current = true;
        if (Array.isArray(d.sessions)) setSessions(d.sessions);
        if (Array.isArray(d.slots)) setSlots(d.slots);
        if (d.playback) setPlayback(d.playback);
      };
    }
    const onStorage = (e) => {
      if (e.key !== STORAGE_KEY || !e.newValue) return;
      try {
        const v = JSON.parse(e.newValue);
        isReceivingRef.current = true;
        if (Array.isArray(v.sessions)) setSessions(v.sessions);
        if (Array.isArray(v.slots)) setSlots(v.slots);
      } catch {}
    };
    window.addEventListener('storage', onStorage);
    return () => {
      channelRef.current?.close();
      channelRef.current = null;
      window.removeEventListener('storage', onStorage);
    };
  }, []);

  // 상태 변경마다 localStorage 저장 + (user action 한정) broadcast
  useEffect(() => {
    if (isInitialMountRef.current) {
      isInitialMountRef.current = false;
      return;
    }
    const isReceiving = isReceivingRef.current;
    const isTick = isTickRef.current;
    isReceivingRef.current = false;
    isTickRef.current = false;
    savePersistedState({sessions, slots});
    if (isReceiving || isTick) return;
    channelRef.current?.postMessage({
      type: 'state',
      payload: {sessions, slots, playback},
    });
  }, [sessions, slots, playback]);

  // 풀스크린 토글
  const enterTvFullscreen = (slotNum = null) => {
    setTvSlotNum(slotNum);
    setIsTvFullscreen(true);
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  };
  const exitTvFullscreen = () => {
    setIsTvFullscreen(false);
    setTvSlotNum(null);
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  };

  // ESC 키 → 풀스크린 종료
  useEffect(() => {
    if (!isTvFullscreen) return;
    const onKey = (e) => { if (e.key === 'Escape') setIsTvFullscreen(false); };
    const onFsChange = () => { if (!document.fullscreenElement) setIsTvFullscreen(false); };
    window.addEventListener('keydown', onKey);
    document.addEventListener('fullscreenchange', onFsChange);
    return () => {
      window.removeEventListener('keydown', onKey);
      document.removeEventListener('fullscreenchange', onFsChange);
    };
  }, [isTvFullscreen]);

  // 1초 카운트다운 — 모든 세션 동시 tick (자체 blindStructure 사용)
  const anyActive = sessions.some(s => !s.isPaused);
  useEffect(() => {
    if (!anyActive) return;
    const interval = setInterval(() => {
      isTickRef.current = true;
      setSessions(prev => prev.map(s => {
        if (s.isPaused) return s;
        if (s.levelSecondsLeft > 1) {
          return {...s, levelSecondsLeft: s.levelSecondsLeft - 1};
        }
        const structure = s.blindStructure || DEFAULT_BLIND_STRUCTURE;
        const next = structure.find(l => l.level === s.currentLevel + 1);
        if (!next) return {...s, levelSecondsLeft: 0};
        return {
          ...s,
          currentLevel: next.level,
          smallBlind: next.sb,
          bigBlind: next.bb,
          ante: next.ante,
          levelSecondsLeft: next.duration || DEMO_LEVEL_DURATION,
        };
      }));
    }, 1000);
    return () => clearInterval(interval);
  }, [anyActive]);

  // ==================== 멀티 세션 액션 ====================
  const updateSession = (sessionId, updater) => {
    setSessions(prev => prev.map(s => s.id === sessionId ? updater(s) : s));
  };

  // 빈 슬롯 찾기 (없으면 새 슬롯 발급)
  const assignToFirstFreeSlot = (sessionId) => {
    setSlots(prev => {
      const freeIdx = prev.findIndex(sl => !sl.sessionId);
      if (freeIdx >= 0) {
        return prev.map((sl, i) => i === freeIdx ? {...sl, sessionId} : sl);
      }
      // 빈 슬롯 없으면 새 슬롯 추가
      const nextSlotNum = (prev[prev.length - 1]?.slotNum || 0) + 1;
      return [...prev, {slotNum: nextSlotNum, sessionId}];
    });
  };

  const startNewLive = (template = TOURNAMENT_TEMPLATES[0]) => {
    const ns = makeSession(template);
    setSessions(prev => [...prev, ns]);
    assignToFirstFreeSlot(ns.id);
    return ns.id;
  };

  const stopSession = (sessionId) => {
    const targetId = sessionId || sessions[0]?.id;
    if (!targetId) return;
    setSessions(prev => prev.filter(s => s.id !== targetId));
    setSlots(prev => prev.map(sl => sl.sessionId === targetId ? {...sl, sessionId: null} : sl));
  };

  const togglePauseSession = (sessionId) =>
    updateSession(sessionId, s => ({...s, isPaused: !s.isPaused}));

  const goToLevelInSession = (sessionId, delta) =>
    updateSession(sessionId, s => {
      const structure = s.blindStructure || DEFAULT_BLIND_STRUCTURE;
      const target = structure.find(l => l.level === s.currentLevel + delta);
      if (!target) return s;
      return {...s, currentLevel: target.level, smallBlind: target.sb, bigBlind: target.bb, ante: target.ante, levelSecondsLeft: target.duration || DEMO_LEVEL_DURATION};
    });

  const nextLevelSession = (sessionId) => goToLevelInSession(sessionId, +1);
  const prevLevelSession = (sessionId) => goToLevelInSession(sessionId, -1);

  const addSecondsToSession = (sessionId, delta) =>
    updateSession(sessionId, s => ({
      ...s,
      levelSecondsLeft: Math.max(0, Math.min(DEMO_LEVEL_DURATION * 3, s.levelSecondsLeft + delta)),
    }));

  const eliminatePlayerInSession = (sessionId) =>
    updateSession(sessionId, s => ({...s, playersRemaining: Math.max(1, s.playersRemaining - 1)}));

  const toggleLateRegInSession = (sessionId) =>
    updateSession(sessionId, s => ({...s, lateRegClosed: !s.lateRegClosed}));

  // 토너 템플릿 CRUD (M18)
  const createTemplate = (tpl) => {
    const newTpl = {
      ...tpl,
      templateId: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
    };
    setCustomTemplates(prev => [...prev, newTpl]);
    return newTpl.templateId;
  };
  const updateTemplate = (templateId, updates) => {
    setCustomTemplates(prev => prev.map(t => t.templateId === templateId ? {...t, ...updates} : t));
  };
  const deleteTemplate = (templateId) => {
    setCustomTemplates(prev => prev.filter(t => t.templateId !== templateId));
  };
  const duplicateTemplate = (templateId) => {
    const src = customTemplates.find(t => t.templateId === templateId);
    if (!src) return null;
    return createTemplate({...src, tournamentName: `${src.tournamentName} (복사)`});
  };

  // 시리즈 CRUD (M19)
  const createSeries = (s) => {
    const newS = {...s, seriesId: `series-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`};
    setSeries(prev => [...prev, newS]);
    return newS.seriesId;
  };
  const updateSeries = (seriesId, updates) => {
    setSeries(prev => prev.map(s => s.seriesId === seriesId ? {...s, ...updates} : s));
  };
  const deleteSeries = (seriesId) => {
    setSeries(prev => prev.filter(s => s.seriesId !== seriesId));
  };
  // 본선 진출자 자동 집계 (위성 예선 1회 결과 추가 mock)
  const addFinalistsBatch = (seriesId, storeId, date) => {
    const stamp = new Date().toISOString().slice(0, 10);
    const newOnes = [
      {seriesId, nick: `유저${Math.floor(Math.random() * 100)}`, storeId, date: date || stamp, rank: 1},
      {seriesId, nick: `유저${Math.floor(Math.random() * 100)}`, storeId, date: date || stamp, rank: 2},
    ];
    setFinalists(prev => [...prev, ...newOnes]);
    setSeries(prev => prev.map(s =>
      s.seriesId === seriesId
        ? {...s, satelliteCompleted: s.satelliteCompleted + 1, finalistCount: s.finalistCount + 2}
        : s
    ));
  };

  // 슬롯 관리
  const setSlotSession = (slotNum, sessionId) => {
    setSlots(prev => prev.map(sl => sl.slotNum === slotNum ? {...sl, sessionId} : sl));
  };
  const addSlot = () => {
    setSlots(prev => [...prev, {slotNum: (prev[prev.length - 1]?.slotNum || 0) + 1, sessionId: null}]);
  };
  const removeSlot = (slotNum) => {
    setSlots(prev => prev.filter(sl => sl.slotNum !== slotNum));
  };

  // ==================== 호환성 alias (M8 이전 단일 세션 컴포넌트용) ====================
  const startLive = () => startNewLive();
  const stopLive = () => stopSession(session?.id);
  const togglePause = () => session && togglePauseSession(session.id);
  const nextLevel = () => session && nextLevelSession(session.id);
  const prevLevel = () => session && prevLevelSession(session.id);
  const addSeconds = (delta) => session && addSecondsToSession(session.id, delta);
  const eliminatePlayer = () => session && eliminatePlayerInSession(session.id);
  const toggleLateReg = () => session && toggleLateRegInSession(session.id);

  // ==================== 자동 시연 (M6) — 액션 dispatcher ====================
  const clearPlaybackTimers = () => {
    playbackTimersRef.current.forEach(t => clearTimeout(t));
    playbackTimersRef.current = [];
  };

  const executePlaybackAction = (action) => {
    // 시연은 항상 첫 세션 기준 (M11에서 멀티 세션 시나리오로 확장)
    switch (action) {
      case 'startLive': {
        const tpl = customTemplates[0] || SEED_TEMPLATES[0];
        const ns = makeSession(tpl);
        setSessions([ns]);
        setSlots([{slotNum: 1, sessionId: ns.id}, {slotNum: 2, sessionId: null}]);
        break;
      }
      case 'addOneMinute':
        setSessions(prev => prev.length === 0 ? prev : prev.map((s, i) => i === 0
          ? {...s, levelSecondsLeft: Math.min(DEMO_LEVEL_DURATION * 3, s.levelSecondsLeft + 60)}
          : s));
        break;
      case 'eliminate3': {
        const elim = () => setSessions(prev => prev.length === 0 ? prev : prev.map((s, i) => i === 0
          ? {...s, playersRemaining: Math.max(1, s.playersRemaining - 1)} : s));
        elim();
        playbackTimersRef.current.push(setTimeout(elim, 400));
        playbackTimersRef.current.push(setTimeout(elim, 800));
        break;
      }
      case 'nextLevel':
        setSessions(prev => prev.length === 0 ? prev : prev.map((s, i) => {
          if (i !== 0) return s;
          const structure = s.blindStructure || DEFAULT_BLIND_STRUCTURE;
          const next = structure.find(l => l.level === s.currentLevel + 1);
          if (!next) return s;
          return {...s, currentLevel: next.level, smallBlind: next.sb, bigBlind: next.bb, ante: next.ante, levelSecondsLeft: next.duration || DEMO_LEVEL_DURATION};
        }));
        break;
      case 'closeLateReg':
        setSessions(prev => prev.map((s, i) => i === 0 ? {...s, lateRegClosed: true} : s));
        break;
      case 'pause':
        setSessions(prev => prev.map((s, i) => i === 0 ? {...s, isPaused: true} : s));
        break;
      case 'resume':
        setSessions(prev => prev.map((s, i) => i === 0 ? {...s, isPaused: false} : s));
        break;
      case 'stop':
        setSessions([]);
        setSlots(prev => prev.map(sl => ({...sl, sessionId: null})));
        break;
    }
  };

  const startPlayback = () => {
    clearPlaybackTimers();
    setSessions([]);
    setSlots(INITIAL_SLOTS);
    setPlayback({running: true, caption: '준비 중...', step: -1});

    DEMO_SCENARIO.forEach((step, idx) => {
      const t = setTimeout(() => {
        setPlayback({running: true, caption: step.caption, step: idx});
        if (step.action) executePlaybackAction(step.action);
      }, step.at);
      playbackTimersRef.current.push(t);
    });

    const endTimer = setTimeout(() => {
      setPlayback({running: false, caption: '', step: -1});
    }, DEMO_TOTAL_MS);
    playbackTimersRef.current.push(endTimer);
  };

  const stopPlayback = () => {
    clearPlaybackTimers();
    setPlayback({running: false, caption: '', step: -1});
    setSessions([]);
    setSlots(INITIAL_SLOTS);
  };

  return (
    <LiveStateContext.Provider value={{
      // 멀티 세션 데이터
      sessions, slots, store: STORE_INFO,
      templates: customTemplates,
      createTemplate, updateTemplate, deleteTemplate, duplicateTemplate,
      // 역할 + 시리즈 (M19)
      currentRole, setCurrentRole,
      organizer: ORGANIZER_INFO,
      series, finalists,
      createSeries, updateSeries, deleteSeries, addFinalistsBatch,
      // 호환성 alias (단일 세션 표면 — M8 이전 컴포넌트용)
      isLive, isPaused, session, startedAt,
      lateRegMinutes: computeLateRegMinutes(session),
      nextBlind: session ? (session.blindStructure || DEFAULT_BLIND_STRUCTURE).find(l => l.level === session.currentLevel + 1) : null,
      // 호환성 액션
      startLive, stopLive, togglePause,
      nextLevel, prevLevel, addSeconds,
      eliminatePlayer, toggleLateReg,
      // 멀티 세션 액션 (M8+)
      startNewLive, stopSession,
      togglePauseSession, nextLevelSession, prevLevelSession,
      addSecondsToSession, eliminatePlayerInSession, toggleLateRegInSession,
      setSlotSession, addSlot, removeSlot,
      // 풀스크린
      isTvFullscreen, tvSlotNum, enterTvFullscreen, exitTvFullscreen,
      // 자동 시연
      playback, startPlayback, stopPlayback,
    }}>
      {children}
    </LiveStateContext.Provider>
  );
};

// ==================== LIVE TIMER HOOK ====================
function useCountdown(initialSeconds, isActive) {
  const [seconds, setSeconds] = useState(initialSeconds);
  useEffect(() => {
    if (!isActive) return;
    const interval = setInterval(() => {
      setSeconds(s => s > 0 ? s - 1 : 0);
    }, 1000);
    return () => clearInterval(interval);
  }, [isActive]);
  return seconds;
}

  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  const diffMs = d.getTime() - Date.now();
  return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
};

// ==================== SESSION TIMER GRID (M9-fix) ====================
// 매장 상세에서 진행 중 세션 N개를 1/2/3분할로 표시. 4개+는 3분할 유지하며 줄바꿈.
const SessionTimerGrid = ({sessions, onNavigate}) => {
  const cols = sessions.length === 1 ? 1 : sessions.length === 2 ? 2 : 3;
  return (
    <div style={{display: 'grid', gridTemplateColumns: `repeat(${cols}, 1fr)`, gap: '8px'}}>
      {sessions.map(s => (
        <SessionTimerCard
          key={s.id}
          session={s}
          cols={cols}
          onClick={() => s.tournamentType !== 'cash' && onNavigate('live', s.id)}
        />
      ))}
    </div>
  );
};

const TIMER_CARD_SIZES = {
  1: {timer: 56, name: 16, meta: 12, padding: '20px 22px', gap: '8px'},
  2: {timer: 38, name: 13, meta: 11, padding: '14px 14px', gap: '6px'},
  3: {timer: 24, name: 11, meta: 10, padding: '10px 10px', gap: '4px'},
};

const SessionTimerCard = ({session, cols, onClick}) => {
  const isCash = session.tournamentType === 'cash';
  const isPaused = session.isPaused;
  const sz = TIMER_CARD_SIZES[cols] || TIMER_CARD_SIZES[3];
  const lateMin = !isCash && !session.lateRegClosed ? computeLateRegMinutes(session) : 0;
  const lowTime = !isCash && !isPaused && (session.levelSecondsLeft || 0) <= 10;

  return (
    <div onClick={onClick} className="card-hover"
      style={{
        background: '#FEE2E2',
        borderRadius: '14px',
        padding: sz.padding,
        cursor: isCash ? 'default' : 'pointer',
        display: 'flex',
        flexDirection: 'column',
        gap: sz.gap,
        minWidth: 0,
      }}>
      <div style={{display: 'flex', alignItems: 'center', gap: '4px'}}>
        {isPaused ? (
          <span style={{fontSize: '9px', color: '#A86A00', fontWeight: 800, letterSpacing: '0.04em'}}>⏸ PAUSED</span>
        ) : (
          <>
            <div className="pulse-dot" style={{width: 5, height: 5, borderRadius: '50%', background: '#E53E3E', flexShrink: 0}}></div>
            <span style={{fontSize: '9px', color: '#E53E3E', fontWeight: 800, letterSpacing: '0.06em'}}>LIVE</span>
          </>
        )}
      </div>
      <div style={{fontSize: `${sz.name}px`, fontWeight: 700, color: '#111', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>
        {session.tournamentName}
      </div>
      {!isCash ? (
        <>
          <div className="mono" style={{
            fontSize: `${sz.timer}px`,
            fontWeight: 800,
            color: lowTime ? '#E53E3E' : (isPaused ? '#A86A00' : '#111'),
            lineHeight: 1,
            letterSpacing: '-0.03em',
          }}>
            {fmtTime(session.levelSecondsLeft || 0)}
          </div>
          <div style={{fontSize: `${sz.meta}px`, color: '#767676'}}>
            Lv {session.currentLevel} · {session.playersRemaining}명
            {cols === 1 && (
              <span> · {session.lateRegClosed ? '등록 마감' : `등록 ${lateMin}분`}</span>
            )}
          </div>
        </>
      ) : (
        <div style={{fontSize: `${sz.meta}px`, color: '#767676'}}>
          자리 {session.seatsAvailable || 0}석
        </div>
      )}
    </div>
  );
};

const LiveFullscreenScreen = ({liveId, onClose}) => {
  const {sessions, store} = useLive();
  // 1) Provider 세션 (어드민이 운영 중인 세션) 검색 — 자체 카운트다운, 컨텍스트 그대로
  const providerSession = sessions.find(s => s.id === liveId);
  // 2) 정적 mock 세션 (다른 매장 — 자체 useCountdown 시뮬레이션)
  const staticLive = LIVE_SESSIONS.find(l => l.id === liveId);
  // hook order 유지: 두 카운트다운 항상 호출
  const fallbackSeconds = useCountdown(staticLive?.levelSecondsLeft || 0, !providerSession);
  const fallbackLateReg = useCountdown((staticLive?.lateRegMinutes || 0) * 60, !providerSession);

  // Provider 세션이면 그 데이터, 아니면 mock
  const live = providerSession
    ? {
        ...providerSession,
        storeName: store.storeName,
        storeDistance: store.storeDistance,
        photoStyle: store.photoStyle,
      }
    : staticLive;
  if (!live) return null;

  const seconds = providerSession ? providerSession.levelSecondsLeft : fallbackSeconds;
  const lateRegSeconds = providerSession
    ? (providerSession.lateRegClosed ? 0 : computeLateRegMinutes(providerSession) * 60)
    : fallbackLateReg;

  return (
    <div style={{height: '100%', background: '#0A0A0A', color: '#FFFFFF', display: 'flex', flexDirection: 'column', overflow: 'hidden'}} className="screen-slide-in">
      {/* Top bar */}

        <div style={{width: 36, height: 36, borderRadius: '50%', background: '#1A1A1A', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer'}}>
          <Icon.Share />
        </div>
      </div>

      {/* Store info */}
      <div style={{textAlign: 'center', paddingTop: '24px'}}>
        <div style={{width: 44, height: 44, borderRadius: '50%', background: '#1A1A1A', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: '12px'}}>
          <span className="serif" style={{fontSize: '20px', fontWeight: 900}}>A</span>
        </div>
        <div style={{fontSize: '14px', fontWeight: 700}}>{live.storeName}</div>
        <div style={{fontSize: '12px', color: '#A8A8A8', marginTop: '4px'}}>{live.storeDistance} · 👁 {live.viewers}명 시청</div>
      </div>

      {/* LIVE indicator */}

        <div className="pulse-dot" style={{width: 10, height: 10, borderRadius: '50%', background: '#FF4757'}}></div>
        <span style={{color: '#FF4757', fontWeight: 800, fontSize: '12px', letterSpacing: '2px'}}>LIVE</span>
      </div>

      {/* Tournament name */}

        {live.tournamentName}
      </div>

      {/* Level */}
      <div style={{textAlign: 'center', color: '#A8A8A8', fontSize: '11px', fontWeight: 700, letterSpacing: '3px', paddingTop: '16px'}}>
        LEVEL {live.currentLevel}

// ==================== STORE ADMIN (M15) ====================
const StoreAdminContent = () => {
  const {sessions, templates, enterTvFullscreen, startNewLive} = useLive();
  const [activeMenu, setActiveMenu] = useState('live');
  const [selectedId, setSelectedId] = useState(null);
  const [showNewModal, setShowNewModal] = useState(false);

  useEffect(() => {
    if (sessions.length === 0) {
      if (selectedId !== null) setSelectedId(null);
      return;
    }
    const exists = sessions.some(s => s.id === selectedId);
    if (!exists) setSelectedId(sessions[0].id);
  }, [sessions]);

  const selectedSession = sessions.find(s => s.id === selectedId) || sessions[0] || null;

  const handleNewLive = (template) => {
    const newId = startNewLive(template);
    setSelectedId(newId);
    setActiveMenu('live');
    setShowNewModal(false);
  };

  return (
    <div style={{display: 'flex', flexDirection: 'column', height: '100%', position: 'relative'}}>
      {/* 메뉴 탭 */}
      <div className="admin-menu-tabs">
        <button className={`admin-menu-tab ${activeMenu === 'live' ? 'active' : ''}`} onClick={() => setActiveMenu('live')}>
          🎬 LIVE
          {sessions.length > 0 && <span className="badge">{sessions.length}</span>}
        </button>
        <button className={`admin-menu-tab ${activeMenu === 'templates' ? 'active' : ''}`} onClick={() => setActiveMenu('templates')}>
          🎲 템플릿
        </button>
        <button className={`admin-menu-tab ${activeMenu === 'store' ? 'active' : ''}`} onClick={() => setActiveMenu('store')}>
          🏬 매장 정보
        </button>
        <button className={`admin-menu-tab ${activeMenu === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveMenu('dashboard')}>
          📊 대시보드
        </button>
        <button className={`admin-menu-tab ${activeMenu === 'ads' ? 'active' : ''}`} onClick={() => setActiveMenu('ads')}>
          📣 광고
        </button>
        <button className={`admin-menu-tab ${activeMenu === 'stats' ? 'active' : ''}`} onClick={() => setActiveMenu('stats')}>
          📈 통계
        </button>
      </div>

      {/* 컨텐츠 */}
      {activeMenu === 'live' && (
        <>
          {sessions.length === 0 ? (
            <div style={{flex: 1, overflow: 'auto'}}>
              <AdminEmpty templates={templates} onStart={handleNewLive} onPreviewTv={() => enterTvFullscreen()} />
            </div>
          ) : (
            <>
              <div className="session-tabs">
                {sessions.map(s => (
                  <SessionTab
                    key={s.id}
                    session={s}
                    active={s.id === selectedSession?.id}
                    onClick={() => setSelectedId(s.id)}
                  />
                ))}
                <button className="session-tab-add" onClick={() => setShowNewModal(true)}>
                  + 새 LIVE
                </button>
              </div>
              <div style={{flex: 1, overflow: 'auto'}}>
                {selectedSession && <SessionControls sessionId={selectedSession.id} />}
              </div>
            </>
          )}
          <SlotManager />
        </>
      )}

      {activeMenu === 'templates' && <TemplateManager />}
      {activeMenu === 'store' && <StoreInfoManager />}
      {activeMenu === 'dashboard' && <AdminDashboard onGoLive={() => setActiveMenu('live')} onGoAds={() => setActiveMenu('ads')} />}
      {activeMenu === 'ads' && <AdsStore />}
      {activeMenu === 'stats' && <AdminStats />}

      {/* 새 LIVE 모달 */}
      {showNewModal && (
        <NewLiveModal
          templates={templates}
          onPick={handleNewLive}
          onCancel={() => setShowNewModal(false)}
        />
      )}
    </div>
  );
};

// ==================== TEMPLATE MANAGER (M18) ====================
const TemplateManager = () => {
  const {templates, createTemplate, updateTemplate, deleteTemplate, duplicateTemplate} = useLive();
  // 편집 중인 템플릿 ID. null이면 리스트 보기, 'new'이면 새 생성, 'xxx'이면 그 ID 편집.
  const [editingId, setEditingId] = useState(null);

  if (editingId !== null) {
    const isNew = editingId === 'new';
    const editing = isNew ? null : templates.find(t => t.templateId === editingId);
    return (
      <TemplateEditor
        initial={editing}
        onSave={(tpl) => {
          if (isNew) createTemplate(tpl);
          else updateTemplate(editingId, tpl);
          setEditingId(null);
        }}
        onCancel={() => setEditingId(null)}
        onDelete={!isNew ? () => {
          if (window.confirm(`"${editing.tournamentName}" 템플릿을 삭제할까요?`)) {
            deleteTemplate(editingId);
            setEditingId(null);
          }
        } : null}
      />
    );
  }

  return (
    <div className="admin-section">
      <div>
        <div className="admin-section-title">🎲 토너 템플릿</div>
        <div className="admin-section-subtitle">미리 만들어두고 새 LIVE 시작 시 바로 사용</div>
      </div>

      <button
        onClick={() => setEditingId('new')}
        style={{
          background: '#111', color: '#fff', border: 'none',
          padding: '12px', borderRadius: '10px', fontSize: '13px', fontWeight: 700,
          cursor: 'pointer', fontFamily: 'Pretendard, sans-serif',
        }}>
        + 새 템플릿 만들기
      </button>

      <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
        {templates.length === 0 && (
          <div style={{padding: '20px', textAlign: 'center', color: '#A8A8A8', fontSize: '12px'}}>
            등록된 템플릿이 없습니다
          </div>
        )}
        {templates.map(t => (
          <div key={t.templateId} className="template-list-card">
            <div className={`template-poster-sq ${t.posterStyle}`} style={{fontSize: 11}}>
              {t.tournamentName.split(' ').slice(0, 2).join(' ')}
            </div>
            <div className="template-list-info">
              <div className="template-list-name">{t.tournamentName}</div>
              <div className="template-list-meta">
                바이인 ₩{(t.buyIn || 0).toLocaleString()} · {t.totalPlayers || '-'}명<br/>
                {(t.blindStructure || []).length}레벨 · 시작 {t.blindStructure?.[0]?.sb}/{t.blindStructure?.[0]?.bb}<br/>
                늦은 등록 Lv {t.lateRegEndLevel}까지
              </div>
            </div>
            <div className="template-list-actions">
              <button onClick={() => setEditingId(t.templateId)}>✏️ 편집</button>
              <button onClick={() => duplicateTemplate(t.templateId)}>📋 복제</button>
              <button className="danger" onClick={() => {
                if (window.confirm(`"${t.tournamentName}" 삭제할까요?`)) deleteTemplate(t.templateId);
              }}>✕ 삭제</button>
            </div>
          </div>
        ))}
      </div>

      <div style={{fontSize: '10px', color: '#A8A8A8', lineHeight: 1.6, padding: '0 4px'}}>
        💡 LIVE 시작 후에는 그 세션이 자체 블라인드 구조를 갖습니다.<br/>
        템플릿을 편집해도 이미 진행 중인 세션은 영향 없음.

// 토너 템플릿 편집기
const TemplateEditor = ({initial, onSave, onCancel, onDelete}) => {
  const [form, setForm] = useState(initial ? {...initial} : {
    tournamentName: '',
    tournamentType: 'freezeout',
    buyIn: 50000,
    guarantee: 0,
    totalPlayers: 20,
    prizePool: 0,
    startingStack: 20000,
    posterStyle: 'poster-dark',
    blindStructure: [...DEFAULT_BLIND_STRUCTURE.slice(0, 5).map(b => ({...b, duration: 90}))],
    lateRegEndLevel: 3,
  });

  const updateField = (key, value) => setForm(f => ({...f, [key]: value}));
  const updateBlind = (idx, key, value) => {
    setForm(f => ({
      ...f,
      blindStructure: f.blindStructure.map((b, i) => i === idx ? {...b, [key]: value} : b),
    }));
  };
  const addBlind = () => {
    setForm(f => {
      const last = f.blindStructure[f.blindStructure.length - 1] || {level: 0, sb: 100, bb: 200, ante: 0, duration: 90};
      return {
        ...f,
        blindStructure: [...f.blindStructure, {
          level: last.level + 1,
          sb: Math.round(last.sb * 1.5),
          bb: Math.round(last.bb * 1.5),
          ante: Math.round((last.ante || 0) * 1.3),
          duration: last.duration,
        }],
      };
    });
  };
  const removeBlind = (idx) => {
    setForm(f => ({
      ...f,
      blindStructure: f.blindStructure.filter((_, i) => i !== idx).map((b, i) => ({...b, level: i + 1})),
    }));
  };

  const valid = form.tournamentName.trim() && form.blindStructure.length > 0;

  const posterOptions = [
    {style: 'poster-dark', label: 'Dark'},
    {style: 'poster-cream', label: 'Cream'},
    {style: 'poster-green', label: 'Green'},
    {style: 'poster-blue', label: 'Blue'},
    {style: 'poster-rust', label: 'Rust'},
    {style: 'poster-pink', label: 'Pink'},
  ];

  return (
    <div className="admin-section">
      <div>
        <div className="admin-section-title">{initial ? '✏️ 템플릿 편집' : '＋ 새 템플릿'}</div>
        <div className="admin-section-subtitle">{initial ? '저장 시 즉시 반영됩니다' : '모든 필드 입력 후 저장'}</div>
      </div>

      <div className="template-editor-form">
        {/* 기본 정보 */}
        <div className="form-field">
          <div className="form-label">토너 제목</div>
          <input className="form-input" value={form.tournamentName}
            onChange={e => updateField('tournamentName', e.target.value)}
            placeholder="예: 프리징 90GTD" />
        </div>

        <div className="form-row">
          <div className="form-field">
            <div className="form-label">타입</div>
            <select className="form-input" value={form.tournamentType}
              onChange={e => updateField('tournamentType', e.target.value)}>
              <option value="freezeout">프리징</option>
              <option value="rebuy">리바이</option>
              <option value="turbo">터보</option>
              <option value="bounty">바운티</option>
              <option value="satellite">위성 예선</option>
            </select>
          </div>
          <div className="form-field">
            <div className="form-label">포스터 색</div>
            <select className="form-input" value={form.posterStyle}
              onChange={e => updateField('posterStyle', e.target.value)}>
              {posterOptions.map(p => <option key={p.style} value={p.style}>{p.label}</option>)}
            </select>
          </div>
        </div>

        <div className="form-row-3">
          <div className="form-field">
            <div className="form-label">바이인 (₩)</div>
            <input className="form-input mono" type="number" value={form.buyIn}
              onChange={e => updateField('buyIn', parseInt(e.target.value) || 0)} />
          </div>
          <div className="form-field">
            <div className="form-label">게런티 (₩)</div>
            <input className="form-input mono" type="number" value={form.guarantee}
              onChange={e => updateField('guarantee', parseInt(e.target.value) || 0)} />
          </div>
          <div className="form-field">
            <div className="form-label">인원</div>
            <input className="form-input mono" type="number" value={form.totalPlayers}
              onChange={e => updateField('totalPlayers', parseInt(e.target.value) || 0)} />
          </div>
        </div>

        <div className="form-row">
          <div className="form-field">
            <div className="form-label">시작 칩</div>
            <input className="form-input mono" type="number" value={form.startingStack}
              onChange={e => updateField('startingStack', parseInt(e.target.value) || 0)} />
          </div>
          <div className="form-field">
            <div className="form-label">늦은 등록 마감 레벨</div>
            <input className="form-input mono" type="number" min="1" max={form.blindStructure.length}
              value={form.lateRegEndLevel}
              onChange={e => updateField('lateRegEndLevel', parseInt(e.target.value) || 1)} />
          </div>
        </div>

        {/* 블라인드 구조 편집 */}
        <div className="form-field">
          <div className="form-label" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
            <span>블라인드 구조 ({form.blindStructure.length}레벨)</span>
            <button onClick={addBlind} style={{background: '#111', color: '#fff', border: 'none', padding: '3px 8px', borderRadius: 5, fontSize: 10, fontWeight: 700, cursor: 'pointer', fontFamily: 'Pretendard'}}>
              + 레벨 추가
            </button>
          </div>
          <div style={{background: '#fff', border: '1.5px solid #EAEAEA', borderRadius: 8, padding: '6px 10px', maxHeight: 220, overflowY: 'auto'}}>
            <div className="blind-row header">
              <div>Lv</div>
              <div>SB</div>
              <div>BB</div>
              <div>Ante</div>
              <div>시간(초)</div>
              <div></div>
            </div>
            {form.blindStructure.map((b, idx) => (
              <div key={idx} className="blind-row">
                <div className="level-num">{idx + 1}</div>
                <input className="form-input small mono" type="number" value={b.sb}
                  onChange={e => updateBlind(idx, 'sb', parseInt(e.target.value) || 0)} />
                <input className="form-input small mono" type="number" value={b.bb}
                  onChange={e => updateBlind(idx, 'bb', parseInt(e.target.value) || 0)} />
                <input className="form-input small mono" type="number" value={b.ante || 0}
                  onChange={e => updateBlind(idx, 'ante', parseInt(e.target.value) || 0)} />
                <input className="form-input small mono" type="number" value={b.duration}
                  onChange={e => updateBlind(idx, 'duration', parseInt(e.target.value) || 60)} />
                <button className="remove-btn" onClick={() => removeBlind(idx)} title="삭제">×</button>
              </div>
            ))}
          </div>
          <div style={{fontSize: 10, color: '#A8A8A8', marginTop: 4}}>
            💡 데모 편의로 시간은 초 단위. 실 운영은 보통 1200(20분).
          </div>
        </div>

        {/* 액션 */}
        <div className="editor-actions">
          {onDelete && <button className="delete" onClick={onDelete}>삭제</button>}
          <button className="cancel" onClick={onCancel}>취소</button>
          <button className="save" disabled={!valid}
            style={!valid ? {opacity: 0.4, cursor: 'not-allowed'} : {}}
            onClick={() => onSave({
              ...form,
              // 레벨 번호 재정렬 + 음수 방지
              blindStructure: form.blindStructure.map((b, i) => ({
                level: i + 1,
                sb: Math.max(1, b.sb),
                bb: Math.max(1, b.bb),
                ante: Math.max(0, b.ante || 0),
                duration: Math.max(5, b.duration || 60),
              })),
            })}>
            {initial ? '저장' : '템플릿 만들기'}
          </button>
        </div>
      </div>
    </div>
  );
};

const SignupWizard = ({onClose}) => {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({
    name: '',
    addressQuery: '',
    addressSelected: null,
    addressDetail: '',
    phone: '',
    hours: '매일 18:00 - 익일 05:00',
    facilities: [],
    photoCount: 0,
    loginId: '',
    password: '',
    agree: false,
  });
  const update = (k, v) => setForm(f => ({...f, [k]: v}));

  // 카카오 주소 mock 결과
  const addrResults = form.addressQuery.length >= 2 ? [
    {main: '부산광역시 부산진구 서면로 23', sub: '서면역 1번 출구 도보 3분'},
    {main: '부산광역시 부산진구 서면로 45', sub: '롯데백화점 부산본점 옆'},
    {main: '부산광역시 부산진구 부전로 12', sub: '부전시장 인근'},
  ] : [];

  const canProceed = (() => {
    if (step === 1) return form.name.trim() && form.addressSelected && form.phone.trim();
    if (step === 2) return form.hours.trim();
    if (step === 3) return form.photoCount > 0;
    if (step === 4) return form.loginId.length >= 4 && form.password.length >= 6 && form.agree;
    return true;
  })();

  const stepTitle = ['', '기본 정보', '운영 정보', '대표 사진', '계정 생성', '신청 완료'][step];
  const stepDesc = ['', '매장명·주소·전화번호', '영업시간·시설 태그', '최대 10장 (첫 사진 대표)', 'ID·비밀번호 + 약관 동의', '심사 후 승인 처리'][step];

  return (
    <div className="wizard-backdrop">
      <div className="wizard-modal">
        <div className="wizard-header">
          <div className="wizard-step-pills">
            {[1, 2, 3, 4].map(n => (
              <div key={n} className={`wizard-step-pill ${n === step ? 'active' : n < step ? 'done' : ''}`}></div>
            ))}
          </div>
          <div className="wizard-step-label">STEP {Math.min(step, 4)} / 4</div>
          <div className="wizard-step-title">{stepTitle}</div>
          <div className="wizard-step-desc">{stepDesc}</div>
        </div>

        <div className="wizard-body">
          {step === 1 && (
            <>
              <div className="form-field">
                <div className="form-label">매장명</div>
                <input className="form-input" value={form.name} onChange={e => update('name', e.target.value)} placeholder="예: 광안리 카드클럽" />
              </div>
              <div className="form-field">
                <div className="form-label">주소 (카카오 검색)</div>
                {form.addressSelected ? (
                  <div style={{background: '#F0FDF6', border: '1.5px solid #00B074', borderRadius: 8, padding: '10px 12px'}}>
                    <div style={{fontSize: 13, fontWeight: 700, color: '#111'}}>{form.addressSelected.main}</div>
                    <div style={{fontSize: 11, color: '#00875A', marginTop: 2}}>✓ {form.addressSelected.sub}</div>
                    <button onClick={() => update('addressSelected', null)} style={{marginTop: 6, background: 'none', border: 'none', fontSize: 11, color: '#767676', textDecoration: 'underline', cursor: 'pointer', padding: 0, fontFamily: 'Pretendard'}}>
                      다시 검색
                    </button>
                  </div>
                ) : (
                  <>
                    <input className="form-input" value={form.addressQuery}
                      onChange={e => update('addressQuery', e.target.value)}
                      placeholder="🔍 도로명·지번·건물명 검색" />
                    {addrResults.length > 0 && (
                      <div style={{display: 'flex', flexDirection: 'column', gap: 4, marginTop: 6}}>
                        {addrResults.map((r, i) => (
                          <div key={i} className="addr-result" onClick={() => { update('addressSelected', r); update('addressQuery', ''); }}>
                            <div className="addr-result-main">{r.main}</div>
                            <div className="addr-result-sub">{r.sub}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}
              </div>
              <div className="form-row">
                <div className="form-field">
                  <div className="form-label">상세 주소 (선택)</div>
                  <input className="form-input" value={form.addressDetail} onChange={e => update('addressDetail', e.target.value)} placeholder="2층 / B1 등" />
                </div>
                <div className="form-field">
                  <div className="form-label">전화</div>
                  <input className="form-input mono" value={form.phone} onChange={e => update('phone', e.target.value)} placeholder="051-000-0000" />
                </div>
              </div>
            </>
          )}

          {step === 2 && (
            <>
              <div className="form-field">
                <div className="form-label">영업시간</div>
                <input className="form-input" value={form.hours} onChange={e => update('hours', e.target.value)} />
                <div style={{fontSize: 10, color: '#A8A8A8', marginTop: 4}}>요일별 영업시간은 가입 후 어드민에서 설정</div>
              </div>
              <div className="form-field">
                <div className="form-label">시설 ({form.facilities.length}개 선택)</div>
                <div style={{display: 'flex', flexWrap: 'wrap', gap: 6}}>
                  {FACILITY_OPTIONS.map(f => (
                    <button key={f} type="button"
                      onClick={() => update('facilities',
                        form.facilities.includes(f)
                          ? form.facilities.filter(x => x !== f)
                          : [...form.facilities, f])}
                      className={`facility-chip ${form.facilities.includes(f) ? 'active' : ''}`}>
                      {form.facilities.includes(f) ? '✓ ' : ''}{f}
                    </button>
                  ))}
                </div>
              </div>
            </>
          )}

          {step === 3 && (
            <>
              <div className="form-field">
                <div className="form-label">대표 사진 (최대 10장)</div>
                <div className="photo-upload-grid">
                  {Array.from({length: form.photoCount}).map((_, i) => (
                    <div key={i} className={`photo-slot filled ${i % 3 === 0 ? 'photo-warm' : i % 3 === 1 ? 'photo-cool' : 'photo-amber'}`}>
                      <button className="remove" onClick={() => update('photoCount', form.photoCount - 1)}>✕</button>
                    </div>
                  ))}
                  {form.photoCount < 10 && (
                    <div className="photo-slot" onClick={() => update('photoCount', form.photoCount + 1)}>
                      + 사진
                    </div>
                  )}
                </div>
                <div style={{fontSize: 11, color: '#767676', marginTop: 6, lineHeight: 1.5}}>
                  📸 시연용 — 클릭하면 더미 사진 추가<br/>
                  실제: 휴대폰 / 갤러리 / 카메라에서 업로드
                </div>
              </div>
            </>
          )}

          {step === 4 && (
            <>
              <div className="form-field">
                <div className="form-label">매장 로그인 ID (최소 4자)</div>
                <input className="form-input mono" value={form.loginId} onChange={e => update('loginId', e.target.value)} placeholder="예: bsn_001" />
              </div>
              <div className="form-field">
                <div className="form-label">비밀번호 (최소 6자)</div>
                <input className="form-input mono" type="password" value={form.password} onChange={e => update('password', e.target.value)} placeholder="••••••" />
              </div>
              <label style={{display: 'flex', alignItems: 'flex-start', gap: 8, padding: '10px 12px', background: form.agree ? '#F0FDF6' : '#F7F7F7', borderRadius: 8, cursor: 'pointer'}}>
                <input type="checkbox" checked={form.agree} onChange={e => update('agree', e.target.checked)} style={{marginTop: 2}} />
                <div style={{flex: 1, fontSize: 12, color: '#111', lineHeight: 1.5}}>
                  <b>이용약관 및 개인정보 수집 동의</b><br/>
                  <span style={{fontSize: 10, color: '#767676'}}>본 서비스는 정보 제공 플랫폼이며, 베팅·환금 매개를 절대 하지 않음.</span>
                </div>
              </label>
            </>
          )}

          {step === 5 && (
            <div style={{textAlign: 'center', padding: '20px 0'}}>
              <div style={{fontSize: 64, marginBottom: 12}}>🎉</div>
              <div style={{fontSize: 17, fontWeight: 800, color: '#111', marginBottom: 6}}>매장 신청 완료!</div>
              <div style={{fontSize: 12, color: '#767676', lineHeight: 1.6, marginBottom: 14}}>
                <b>{form.name}</b><br/>
                {form.addressSelected?.main}<br/>
                {form.loginId} 계정 생성됨
              </div>
              <div style={{background: '#FFF7E6', border: '1px solid #F5D89A', borderRadius: 10, padding: '10px 14px', fontSize: 11, color: '#A86A00', textAlign: 'left', lineHeight: 1.6}}>
                💡 <b>심사 안내</b>: 1~2 영업일 내 플랫폼 운영팀이 매장 확인 후 승인합니다. 승인되면 SMS 알림 + 어드민 자동 활성화.
              </div>
            </div>
          )}
        </div>

        <div className="wizard-footer">
          {step > 1 && step < 5 && <button className="back" onClick={() => setStep(step - 1)}>이전</button>}
          {step < 4 && <button className="next" disabled={!canProceed} onClick={() => setStep(step + 1)}>다음</button>}
          {step === 4 && <button className="next" disabled={!canProceed} onClick={() => setStep(5)}>신청 제출</button>}
          {step === 5 && <button className="next" onClick={onClose}>닫기</button>}
        </div>
      </div>
    </div>
  );
};

      ...f,
      partnerStoreIds: f.partnerStoreIds.includes(storeId)
        ? f.partnerStoreIds.filter(id => id !== storeId)

          <div className="form-field">
            <div className="form-label">시즌</div>
            <input className="form-input" value={form.season} onChange={e => updateField('season', e.target.value)} placeholder="2026 Spring" />
          </div>

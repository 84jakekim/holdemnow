<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="Pretendard, sans-serif">
  <!-- 거의 블랙 배경 (펠트 그린 X) -->
  <rect width="390" height="844" fill="#0A0A0A"/>

  <!-- Status bar -->
  <text x="28" y="28" fill="#FFFFFF" font-size="15" font-weight="600">9:41</text>
  <text x="350" y="27" fill="#FFFFFF" font-size="13">100%</text>

  <!-- Top bar: close + share -->
  <g transform="translate(0, 56)">
    <circle cx="28" cy="20" r="18" fill="#1A1A1A"/>
    <text x="28" y="26" fill="#FFFFFF" font-size="18" text-anchor="middle">✕</text>
    
    <circle cx="362" cy="20" r="18" fill="#1A1A1A"/>
    <text x="362" y="25" fill="#FFFFFF" font-size="14" text-anchor="middle">⤴</text>
  </g>

  <!-- 매장 정보 (상단, 작게 - 매장 로고/사진을 위한 영역) -->
  <g transform="translate(195, 130)">
    <!-- 매장 로고 -->
    <circle cx="0" cy="0" r="22" fill="#1A1A1A"/>
    <text x="0" y="5" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">A</text>
    
    <text x="0" y="44" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">서면 ABC홀덤</text>
    <text x="0" y="62" fill="#A8A8A8" font-size="12" text-anchor="middle">2.3km</text>
  </g>

  <!-- LIVE 인디케이터 -->
  <g transform="translate(195, 220)">
    <circle cx="-26" cy="0" r="5" fill="#FF4757"/>
    <circle cx="-26" cy="0" r="10" fill="none" stroke="#FF4757" stroke-width="1.5" opacity="0.5"/>
    <text x="-10" y="5" fill="#FF4757" font-size="12" font-weight="800" letter-spacing="2">LIVE</text>
  </g>

  <!-- 토너 이름 -->
  <text x="195" y="262" fill="#FFFFFF" font-size="24" font-weight="800" text-anchor="middle">프리징 90GTD</text>

  <!-- Level -->
  <text x="195" y="304" fill="#A8A8A8" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="3">LEVEL 3</text>

  <!-- 거대 타이머 -->
  <text x="195" y="430" fill="#FFFFFF" font-size="120" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, monospace" letter-spacing="-4">14:32</text>

  <!-- 블라인드 -->
  <text x="195" y="470" fill="#A8A8A8" font-size="11" text-anchor="middle" letter-spacing="3" font-weight="600">BLINDS</text>
  <text x="195" y="506" fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">200 / 400</text>
  <text x="195" y="528" fill="#767676" font-size="13" text-anchor="middle" font-family="JetBrains Mono, monospace">Ante 50</text>

  <!-- Divider -->
  <line x1="40" y1="568" x2="350" y2="568" stroke="#2A2A2A" stroke-width="1"/>

  <!-- 정보 3개 -->
  <g transform="translate(0, 596)">
    <g transform="translate(80, 0)">
      <text x="0" y="0" fill="#767676" font-size="10" text-anchor="middle" letter-spacing="1.5">PLAYERS</text>
      <text x="0" y="30" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">14</text>
      <text x="0" y="48" fill="#767676" font-size="11" text-anchor="middle">2 테이블</text>
    </g>
    
    <g transform="translate(195, 0)">
      <text x="0" y="0" fill="#767676" font-size="10" text-anchor="middle" letter-spacing="1.5">PRIZE POOL</text>
      <text x="0" y="30" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">₩904K</text>
      <text x="0" y="48" fill="#767676" font-size="11" text-anchor="middle">GTD 900K</text>
    </g>
    
    <g transform="translate(310, 0)">
      <text x="0" y="0" fill="#767676" font-size="10" text-anchor="middle" letter-spacing="1.5">LATE REG</text>
      <text x="0" y="30" fill="#FF4757" font-size="22" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">12:00</text>
      <text x="0" y="48" fill="#767676" font-size="11" text-anchor="middle">마감까지</text>
    </g>
  </g>

  <!-- 메인 CTA -->
  <g transform="translate(20, 720)">
    <rect width="350" height="56" rx="14" fill="#FFFFFF"/>
    <text x="175" y="36" fill="#111111" font-size="16" font-weight="800" text-anchor="middle">지금 가기 · 길찾기</text>
  </g>

  <!-- 보조 액션 -->
  <g transform="translate(0, 798)">
    <text x="100" y="14" fill="#FFFFFF" font-size="13" text-anchor="middle">📞 전화</text>
    <text x="195" y="14" fill="#FFFFFF" font-size="13" text-anchor="middle">⭐ 즐겨찾기</text>
    <text x="290" y="14" fill="#FFFFFF" font-size="13" text-anchor="middle">📍 매장정보</text>
  </g>
</svg>

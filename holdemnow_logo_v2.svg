<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Pretendard, sans-serif">
  <rect width="1200" height="900" fill="#FAFAFA"/>

  <text x="600" y="60" fill="#111111" font-size="26" font-weight="800" text-anchor="middle">HoldemNow 로고 v2.0</text>
  <text x="600" y="86" fill="#767676" font-size="13" text-anchor="middle">"미니멀 워드마크 + LIVE 도트" · 카드 모티프 폐기</text>

  <!-- ============ ROW 1: Primary - White BG ============ -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="#767676" font-size="11" font-weight="700" letter-spacing="2">01 · PRIMARY · 라이트</text>
    <rect width="480" height="200" rx="20" fill="#FFFFFF" stroke="#EAEAEA"/>

    <!-- 로고 -->
    <g transform="translate(80, 80)">
      <circle cx="14" cy="20" r="14" fill="#E53E3E"/>
      <text x="44" y="32" fill="#111111" font-size="44" font-weight="800" letter-spacing="-1.5">HoldemNow</text>
    </g>
  </g>

  <!-- ============ ROW 1 RIGHT: Primary - Dark BG ============ -->
  <g transform="translate(640, 140)">
    <text x="0" y="0" fill="#767676" font-size="11" font-weight="700" letter-spacing="2">02 · PRIMARY · 다크</text>
    <rect width="480" height="200" rx="20" fill="#0A0A0A"/>

    <g transform="translate(80, 80)">
      <circle cx="14" cy="20" r="14" fill="#FF4757"/>
      <text x="44" y="32" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="-1.5">HoldemNow</text>
    </g>
  </g>

  <!-- ============ ROW 2: App Icons ============ -->
  <g transform="translate(80, 380)">
    <text x="0" y="0" fill="#767676" font-size="11" font-weight="700" letter-spacing="2">03 · 앱 아이콘 · 다양한 변형</text>

    <!-- Icon 1: Dark with red dot -->
    <g transform="translate(0, 20)">
      <rect width="160" height="160" rx="36" fill="#0A0A0A"/>
      <!-- 간단한 H 마크 + 빨간 도트 -->
      <text x="80" y="100" fill="#FFFFFF" font-size="72" font-weight="800" text-anchor="middle">h</text>
      <circle cx="110" cy="58" r="9" fill="#FF4757"/>
    </g>
    <text x="80" y="206" fill="#767676" font-size="10" text-anchor="middle">기본 (다크)</text>

    <!-- Icon 2: White with dark text -->
    <g transform="translate(200, 20)">
      <rect width="160" height="160" rx="36" fill="#FFFFFF" stroke="#EAEAEA"/>
      <text x="80" y="100" fill="#111111" font-size="72" font-weight="800" text-anchor="middle">h</text>
      <circle cx="110" cy="58" r="9" fill="#E53E3E"/>
    </g>
    <text x="280" y="206" fill="#767676" font-size="10" text-anchor="middle">라이트</text>

    <!-- Icon 3: Brand green accent -->
    <g transform="translate(400, 20)">
      <rect width="160" height="160" rx="36" fill="#00875A"/>
      <text x="80" y="100" fill="#FFFFFF" font-size="72" font-weight="800" text-anchor="middle">h</text>
      <circle cx="110" cy="58" r="9" fill="#FFFFFF"/>
    </g>
    <text x="480" y="206" fill="#767676" font-size="10" text-anchor="middle">브랜드 그린</text>

    <!-- Icon 4: Inverted -->
    <g transform="translate(600, 20)">
      <rect width="160" height="160" rx="36" fill="#FF4757"/>
      <text x="80" y="100" fill="#FFFFFF" font-size="72" font-weight="800" text-anchor="middle">h</text>
      <circle cx="110" cy="58" r="9" fill="#FFFFFF"/>
    </g>
    <text x="680" y="206" fill="#767676" font-size="10" text-anchor="middle">레드 (강조)</text>

    <!-- Icon 5: Just the dot with text -->
    <g transform="translate(800, 20)">
      <rect width="160" height="160" rx="36" fill="#111111"/>
      <circle cx="80" cy="60" r="14" fill="#FF4757"/>
      <text x="80" y="115" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.5">HoldemNow</text>
    </g>
    <text x="880" y="206" fill="#767676" font-size="10" text-anchor="middle">워드 중심</text>
    
    <!-- Icon 6: Monochrome -->
    <g transform="translate(1000, 20)">
      <rect width="160" height="160" rx="36" fill="#1A1A1A"/>
      <text x="80" y="100" fill="#FFFFFF" font-size="72" font-weight="800" text-anchor="middle">h</text>
      <circle cx="110" cy="58" r="9" fill="#FFFFFF"/>
    </g>
    <text x="1080" y="206" fill="#767676" font-size="10" text-anchor="middle">단색</text>
  </g>

  <!-- ============ ROW 3: 야놀자/여기어때 스타일 워드마크 변형 ============ -->
  <g transform="translate(80, 670)">
    <text x="0" y="0" fill="#767676" font-size="11" font-weight="700" letter-spacing="2">04 · 워드마크 변형 (앱 상단 등)</text>
    <rect width="1040" height="180" rx="14" fill="#FFFFFF" stroke="#EAEAEA"/>
    
    <!-- 변형 1: 작은 도트 + 워드 -->
    <g transform="translate(40, 40)">
      <circle cx="6" cy="24" r="5" fill="#E53E3E"/>
      <text x="20" y="30" fill="#111111" font-size="22" font-weight="800" letter-spacing="-0.5">HoldemNow</text>
      <text x="20" y="60" fill="#767676" font-size="10">앱 상단 · 16~20pt</text>
    </g>
    
    <!-- 변형 2: 큰 도트 + 워드 -->
    <g transform="translate(280, 30)">
      <circle cx="10" cy="32" r="9" fill="#E53E3E"/>
      <text x="30" y="40" fill="#111111" font-size="30" font-weight="800" letter-spacing="-1">HoldemNow</text>
      <text x="30" y="68" fill="#767676" font-size="10">랜딩 페이지 · 24~32pt</text>
    </g>
    
    <!-- 변형 3: 도트만 -->
    <g transform="translate(620, 35)">
      <circle cx="22" cy="22" r="18" fill="#FFFFFF" stroke="#EAEAEA"/>
      <circle cx="22" cy="22" r="7" fill="#E53E3E"/>
      <text x="22" y="68" fill="#767676" font-size="10" text-anchor="middle">파비콘</text>
    </g>
    
    <!-- 변형 4: 인스타 프로필 -->
    <g transform="translate(720, 35)">
      <circle cx="22" cy="22" r="22" fill="#0A0A0A"/>
      <text x="22" y="32" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">h</text>
      <circle cx="34" cy="12" r="5" fill="#FF4757"/>
      <text x="22" y="68" fill="#767676" font-size="10" text-anchor="middle">SNS 프로필</text>
    </g>
    
    <!-- 변형 5: 가로형 -->
    <g transform="translate(820, 30)">
      <rect width="180" height="44" rx="22" fill="#111111"/>
      <circle cx="20" cy="22" r="5" fill="#FF4757"/>
      <text x="34" y="28" fill="#FFFFFF" font-size="14" font-weight="800">HoldemNow</text>
      <text x="90" y="68" fill="#767676" font-size="10" text-anchor="middle">버튼·태그</text>
    </g>
  </g>

  <!-- 디자인 원칙 설명 -->
  <g transform="translate(80, 800)">
    <text x="0" y="0" fill="#111111" font-size="13" font-weight="800">v1 → v2 변경 사항</text>
    <text x="0" y="22" fill="#767676" font-size="11">✗ 두 장 카드 모티프 (도박 느낌) → ✓ 미니멀 워드마크 + 도트</text>
    <text x="0" y="40" fill="#767676" font-size="11">✗ 골드 액센트 (라스베가스) → ✓ 빨강 도트만 (LIVE 시그널)</text>
    <text x="0" y="58" fill="#767676" font-size="11">✗ 펠트 그린 배경 → ✓ 어떤 배경에도 어울리는 단순함</text>
  </g>
</svg>
